<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada — AIONEX</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <style>
    body { overflow: hidden; }
    .error-card {
      position: relative; z-index: 1;
      text-align: center;
      padding: 3rem 2.5rem;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: var(--radius-2xl);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      box-shadow: var(--shadow-card);
      animation: cardIn .7s var(--ease-out) both;
      max-width: 420px; width: 90%;
    }
    .error-code {
      font-size: 4rem; font-weight: 800;
      background: var(--gradient-brand-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: .5rem;
    }
    .error-card h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: .5rem; }
    .error-card p { font-size: .9rem; color: var(--text-muted); margin-bottom: 1.5rem; }
    .home-btn {
      display: inline-block;
      padding: .75rem 2rem;
      background: var(--gradient-brand);
      color: #fff; text-decoration: none;
      font-weight: 600; font-size: .92rem;
      border-radius: var(--radius-lg);
      transition: transform .2s, box-shadow .2s;
    }
    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-btn-hover);
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="bg"></div>


  <div class="error-card">
    <div class="error-code">404</div>
    <h1>Página no encontrada</h1>
    <p>La página que buscás no existe o fue movida.</p>
    <a href="index.html" class="home-btn">Volver al inicio</a>
  </div>
  <script src="js/node-network.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
