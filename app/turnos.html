<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Turnos — AIONEX</title>
  <meta name="description" content="Gestioná tus reservas activas e historial de turnos." />
  <meta property="og:title" content="Mis Turnos — AIONEX" />
  <meta property="og:description" content="Gestioná tus reservas activas e historial de turnos." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/turnos.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="bg"></div>


  <div class="main">
    <div class="top-bar">
      <div class="brand">
        <div class="brand-icon">A</div>
        <span class="brand-name">AIONEX</span>
      </div>

      <div class="user-pill" id="userPill">
        <div class="avatar" id="userAvatar">?</div>
        <span id="userName">Cargando…</span>
        <button class="logout-btn" id="logoutBtn" title="Cerrar sesión"><i data-lucide="log-out"></i></button>
      </div>
    </div>

    <h1 class="section-title">Mis Turnos</h1>
    <p class="section-subtitle">Gestioná tus reservas activas e historial</p>

    <div class="panel">
      <div id="loadingState">
        <div class="state-msg">
          <div class="mini-spinner"></div>
          <p>Cargando tus turnos…</p>
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; margin-bottom: 1.5rem;">
        <a href="reservar.html" class="btn-create" style="margin-top:0;">+ Nueva Reserva</a>
      </div>

      <div id="emptyState" style="display:none;">
        <div class="state-msg">
          <div class="icon">📭</div>
          <p>Todavía no tenés ningún turno reservado.</p>
        </div>
      </div>

      <div id="turnosActivosContainer" style="display:none;">
        <h2 style="font-size: 1.1rem; color: var(--text-primary); margin-bottom: 1rem;">Tus Próximos Turnos</h2>
        <div class="turnos-list" id="turnosActivosList"></div>
      </div>

      <div id="turnosHistorialContainer" style="display:none; margin-top: 2.5rem;">
        <h2 style="font-size: 1.1rem; color: var(--text-primary); margin-bottom: 1rem; opacity: 0.8;">Historial</h2>
        <div class="turnos-list" id="turnosHistorialList" style="opacity: 0.8;"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="js/node-network.js"></script>
  <script src="js/utils.js"></script>
  <script>
    let sessionId = null;

    function init() {
      sessionId = getSessionOrRedirect();
      if (!sessionId) return;

      cargarUsuario();
      cargarMisTurnos();

      document.getElementById('logoutBtn').addEventListener('click', cerrarSesion);
    }

    async function cargarUsuario() {
      try {
        const resp = await fetchWithTimeout(`${N8N_BASE_URL}/webhook/usuario`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId })
        });
        if (resp.ok) {
          const data = await resp.json();
          if (data.nombre) {
            document.getElementById('userName').textContent = `${data.nombre} ${data.apellido || ''}`;
            document.getElementById('userAvatar').textContent = data.nombre.charAt(0).toUpperCase();
          }
        }
      } catch (e) {
        console.warn('Error cargando usuario', e);
      }
    }

    async function cargarMisTurnos() {
      try {
        const resp = await fetchWithTimeout(`${N8N_BASE_URL}/webhook/public/mis-turnos-v2`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId })
        });

        document.getElementById('loadingState').style.display = 'none';

        if (!resp.ok) throw new Error('Error del servidor');

        const data = await resp.json();
        const turnos = data.turnos || [];

        if (turnos.length === 0) {
          document.getElementById('emptyState').style.display = 'block';
        } else {
          renderTurnos(turnos);
        }
      } catch (err) {
        document.getElementById('loadingState').style.display = 'none';
        showToast('No se pudieron cargar tus turnos.', 'error');
      }
    }

    function createTurnoCard(turno, isActivo) {
      const estado = turno.estado || 'pendiente';
      
      const card = document.createElement('div');
      card.className = 'turno-card';

      const header = document.createElement('div');
      header.className = 'turno-header';

      const dateBlock = document.createElement('div');
      dateBlock.className = 'turno-date';
      dateBlock.innerHTML = `
        <div class="turno-fecha">${formatFechaDisplay(turno.fecha)}</div>
        <div class="turno-hora">${formatHoraDisplay(turno.hora)} a ${formatHoraDisplay(turno.hora_fin)} hs</div>
      `;

      const badge = document.createElement('div');
      badge.className = `turno-badge badge-${estado}`;
      badge.textContent = estado;

      header.appendChild(dateBlock);
      header.appendChild(badge);
      card.appendChild(header);

      const details = document.createElement('div');
      details.className = 'turno-details';
      details.style.padding = '0 1rem 1rem 1rem';
      details.style.color = 'var(--text-secondary)';
      details.style.fontSize = '0.9rem';
      details.innerHTML = `
        <div style="font-weight:500;color:var(--text-primary);margin-bottom:0.25rem;">${turno.servicio_nombre || 'Turno Genérico'}</div>
        <div>⏱ ${turno.duracion || 30} min — $${turno.costo || 0}</div>
      `;
      card.appendChild(details);

      if (isActivo) {
        const actions = document.createElement('div');
        actions.className = 'turno-actions';

        const btnCancel = document.createElement('button');
        btnCancel.className = 'action-btn btn-cancel';
        btnCancel.textContent = 'Cancelar';
        btnCancel.onclick = () => procesarAccion(turno.id_turno, 'cancelar');

        const btnReschedule = document.createElement('button');
        btnReschedule.className = 'action-btn btn-reschedule';
        btnReschedule.textContent = 'Reprogramar';
        btnReschedule.onclick = () => procesarAccion(turno.id_turno, 'reprogramar');

        actions.appendChild(btnCancel);
        actions.appendChild(btnReschedule);
        card.appendChild(actions);
      }

      return card;
    }

    function renderTurnos(turnos) {
      const containerActivos = document.getElementById('turnosActivosContainer');
      const listActivos = document.getElementById('turnosActivosList');
      const containerHistorial = document.getElementById('turnosHistorialContainer');
      const listHistorial = document.getElementById('turnosHistorialList');

      listActivos.innerHTML = '';
      listHistorial.innerHTML = '';
      
      const activos = turnos.filter(t => t.estado === 'pendiente' || t.estado === 'confirmado');
      const historial = turnos.filter(t => t.estado !== 'pendiente' && t.estado !== 'confirmado');

      if (activos.length > 0) {
        activos.forEach(t => listActivos.appendChild(createTurnoCard(t, true)));
        containerActivos.style.display = 'block';
        listActivos.style.display = 'flex';
      } else {
        containerActivos.style.display = 'none';
      }

      if (historial.length > 0) {
        historial.forEach(t => listHistorial.appendChild(createTurnoCard(t, false)));
        containerHistorial.style.display = 'block';
        listHistorial.style.display = 'flex';
      } else {
        containerHistorial.style.display = 'none';
      }
    }

    async function procesarAccion(idTurno, accion) {
      if (!confirm(`¿Estás seguro de que querés ${accion} este turno?`)) return;

      try {
        const resp = await fetchWithTimeout(`${N8N_BASE_URL}/webhook/cancelar-turno`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, id_turno: idTurno })
        });

        if (resp.ok) {
          showToast(`Turno ${accion === 'reprogramar' ? 'cancelado para reprogramar' : 'cancelado'} exitosamente.`, 'success');

          if (accion === 'reprogramar') {
            setTimeout(() => window.location.href = 'reservar.html', 1500);
          } else {
            document.getElementById('turnosActivosContainer').style.display = 'none';
            document.getElementById('turnosHistorialContainer').style.display = 'none';
            document.getElementById('loadingState').style.display = 'block';
            cargarMisTurnos();
          }
        } else {
          throw new Error('Error al cancelar');
        }
      } catch (err) {
        showToast('Hubo un error al procesar la solicitud.', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
