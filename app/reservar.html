<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservar Turno — AIONEX</title>
  <meta name="description" content="Seleccioná fecha y horario para reservar tu turno en AIONEX." />
  <meta property="og:title" content="Reservar Turno — AIONEX" />
  <meta property="og:description" content="Seleccioná fecha y horario para reservar tu turno en AIONEX." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/reservar.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="bg"></div>


  <div class="main">
    <!-- Top bar -->
    <div class="top-bar">
      <div class="brand">
        <a href="turnos.html" class="back-link" aria-label="Volver a Mis Turnos">←</a>
        <div class="brand-icon">A</div>
        <span class="brand-name">AIONEX</span>
      </div>

      <div class="user-pill" id="userPill">
        <div class="avatar" id="userAvatar">?</div>
        <span id="userName">Cargando…</span>
        <button class="logout-btn" id="logoutBtn" title="Cerrar sesión"><i data-lucide="x"></i></button>
      </div>
    </div>

    <!-- Title -->
    <h1 class="section-title">Reservar turno</h1>
    <p class="section-subtitle">Seleccioná una fecha y un horario disponible</p>

    <!-- Service panel -->
    <div class="panel" id="servicePanel">
      <div class="date-section" id="serviceSelectSection">
        <label for="servicioInput">Servicio</label>
        <select class="date-input" id="servicioInput" disabled>
          <option value="">Cargando servicios…</option>
        </select>
      </div>
      <div class="date-section" id="serviceSummarySection" style="display: none; justify-content: space-between; align-items: center;">
        <div>
          <label style="margin-bottom: 0;">Servicio seleccionado</label>
          <div style="font-weight: 600; color: var(--text-primary);" id="serviceSummaryText"></div>
        </div>
        <button type="button" class="btn-change" onclick="reabrirPaso('servicio')">
          <i data-lucide="pencil" style="width:14px; height:14px;"></i> Cambiar
        </button>
      </div>
    </div>

    <!-- Date panel -->
    <div class="panel" id="datePanel" style="display: none;">
      <div class="date-section" id="dateSelectSection">
        <label for="fechaInput">Fecha</label>
        <input type="date" class="date-input" id="fechaInput" />
        <span class="day-badge" id="dayBadge" style="display:none;"></span>
      </div>
      <div class="date-section" id="dateSummarySection" style="display: none; justify-content: space-between; align-items: center;">
        <div>
          <label style="margin-bottom: 0;">Fecha seleccionada</label>
          <div style="font-weight: 600; color: var(--text-primary);" id="dateSummaryText"></div>
        </div>
        <button type="button" class="btn-change" onclick="reabrirPaso('fecha')">
          <i data-lucide="pencil" style="width:14px; height:14px;"></i> Cambiar
        </button>
      </div>
    </div>

    <!-- Slots panel -->
    <div class="panel" id="slotsPanel" style="display: none;">
      <div class="state-msg" id="emptyState">
        <div class="icon"><i data-lucide="calendar"></i></div>
        <p>Seleccioná una fecha para ver los horarios disponibles</p>
      </div>

      <div id="loadingState" style="display:none;">
        <div class="state-msg">
          <div class="mini-spinner"></div>
          <p>Cargando horarios…</p>
        </div>
      </div>

      <div id="slotsContent" style="display:none;">
        <p class="slots-title">Horarios disponibles</p>
        <div class="slots-grid" id="slotsGrid" role="group" aria-label="Horarios disponibles"></div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot available-dot"></div> Disponible</div>
          <div class="legend-item"><div class="legend-dot taken-dot"></div> Ocupado</div>
          <div class="legend-item"><div class="legend-dot selected-dot"></div> Seleccionado</div>
        </div>

        <div class="obs-section">
          <label for="obsInput">Observaciones <span style="color:rgba(255,255,255,.25);font-style:italic;text-transform:none">(opcional)</span></label>
          <textarea class="obs-input" id="obsInput" placeholder="Alguna indicación especial para tu turno…"></textarea>
        </div>

        <button class="confirm-btn" id="confirmBtn" disabled>
          <span class="btn-text">Confirmar reserva</span>
          <div class="btn-spinner"></div>
        </button>
      </div>
    </div>
  </div>

  <!-- Success overlay -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-card">
      <div class="success-icon"><i data-lucide="check"></i></div>
      <h2>¡Turno reservado!</h2>
      <p>Tu reserva fue registrada correctamente.</p>
      <div class="success-detail">
        <div class="detail-item">
          <div class="detail-label">Fecha</div>
          <div class="detail-value" id="successFecha">—</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Hora</div>
          <div class="detail-value" id="successHora">—</div>
        </div>
      </div>
      <button class="back-to-turnos-btn" onclick="window.location.href='turnos.html'">Volver a Mis Turnos</button>
    </div>
  </div>

  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="js/node-network.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // ─── Estado ─────────────────────────────────────
    let sessionId    = null;
    let selectedSlot = null;

    // ─── Helpers ────────────────────────────────────
    const DIAS_SEMANA = {
      0: 'domingo', 1: 'lunes', 2: 'martes', 3: 'miércoles',
      4: 'jueves', 5: 'viernes', 6: 'sábado'
    };

    // ─── Verificar sesión ───────────────────────────
    async function init() {
      sessionId = getSessionOrRedirect();
      if (!sessionId) return;

      // Set min date = hoy
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm   = String(today.getMonth() + 1).padStart(2, '0');
      const dd   = String(today.getDate()).padStart(2, '0');
      document.getElementById('fechaInput').setAttribute('min', `${yyyy}-${mm}-${dd}`);

      cargarUsuario();
      await cargarServicios();

      document.getElementById('servicioInput').addEventListener('change', onServicioChange);
      document.getElementById('fechaInput').addEventListener('change', onFechaChange);
      document.getElementById('confirmBtn').addEventListener('click', confirmarReserva);
      document.getElementById('logoutBtn').addEventListener('click', cerrarSesion);
    }

    async function cargarUsuario() {
      try {
        const resp = await fetchWithTimeout(`${N8N_BASE_URL}/webhook/usuario`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId })
        });
        if (resp.ok) {
          const data = await resp.json();
          if (data.nombre) {
            document.getElementById('userName').textContent = `${data.nombre} ${data.apellido || ''}`;
            document.getElementById('userAvatar').textContent = data.nombre.charAt(0).toUpperCase();
          }
        }
      } catch (e) {
        console.warn('No se pudo cargar info del usuario:', e);
      }
    }

    async function cargarServicios() {
      try {
        const resp = await fetchWithTimeout(`${N8N_BASE_URL}/webhook/public/servicios-activos`);
        if (!resp.ok) throw new Error('Error al cargar servicios');
        let servicios = await resp.json();
        
        // n8n a veces devuelve [{}] cuando no hay resultados
        servicios = servicios.filter(s => s.id_servicio);
        
        const select = document.getElementById('servicioInput');
        
        if (!servicios || servicios.length === 0) {
          select.innerHTML = '<option value="">No hay servicios disponibles en este momento</option>';
          select.disabled = true;
          return;
        }

        select.innerHTML = '<option value="">Seleccioná un servicio...</option>';
        
        // Group by tipo_nombre
        const grupos = {};
        servicios.forEach(s => {
          if (!grupos[s.tipo_nombre]) grupos[s.tipo_nombre] = [];
          grupos[s.tipo_nombre].push(s);
        });

        for (const [tipo, servs] of Object.entries(grupos)) {
          const optgroup = document.createElement('optgroup');
          optgroup.label = tipo;
          servs.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id_servicio;
            opt.textContent = `${s.nombre} (⏱ ${s.duracion}m - $${s.costo})`;
            optgroup.appendChild(opt);
          });
          select.appendChild(optgroup);
        }
        select.disabled = false;
      } catch (e) {
        console.error(e);
        document.getElementById('servicioInput').innerHTML = '<option value="">Error al cargar</option>';
        showToast('No se pudieron cargar los servicios.', 'error');
      }
    }

    function onServicioChange(e) {
      const select = e.target;
      if (select.value) {
        document.getElementById('serviceSelectSection').style.display = 'none';
        const optText = select.options[select.selectedIndex].textContent;
        document.getElementById('serviceSummaryText').textContent = optText;
        document.getElementById('serviceSummarySection').style.display = 'flex';
        
        document.getElementById('datePanel').style.display = 'block';
        const fechaInput = document.getElementById('fechaInput');
        if (fechaInput.value) {
          onFechaChange({ target: { value: fechaInput.value } });
        } else {
          document.getElementById('slotsPanel').style.display = 'none';
        }
      } else {
        document.getElementById('datePanel').style.display = 'none';
        document.getElementById('slotsPanel').style.display = 'none';
        resetSlotsState();
      }
    }

    function reabrirPaso(paso) {
      if (paso === 'servicio') {
        document.getElementById('serviceSummarySection').style.display = 'none';
        document.getElementById('serviceSelectSection').style.display = 'block';
        
        document.getElementById('datePanel').style.display = 'none';
        document.getElementById('slotsPanel').style.display = 'none';
        
        document.getElementById('dateSummarySection').style.display = 'none';
        document.getElementById('dateSelectSection').style.display = 'block';
        document.getElementById('servicioInput').value = '';
      } else if (paso === 'fecha') {
        document.getElementById('dateSummarySection').style.display = 'none';
        document.getElementById('dateSelectSection').style.display = 'block';
        
        document.getElementById('slotsPanel').style.display = 'none';
        document.getElementById('fechaInput').value = '';
      }
      resetSlotsState();
    }

    function resetSlotsState() {
      selectedSlot = null;
      document.getElementById('confirmBtn').disabled = true;
      document.getElementById('emptyState').style.display = 'block';
      document.getElementById('slotsContent').style.display = 'none';
      document.getElementById('loadingState').style.display = 'none';
    }

    // ─── Cambio de fecha ────────────────────────────
    async function onFechaChange(e) {
      const fecha = e.target.value;
      const idServicio = document.getElementById('servicioInput').value;
      
      if (!fecha || !idServicio) return;

      const dateObj = new Date(fecha + 'T12:00:00');
      const diaSemana = DIAS_SEMANA[dateObj.getDay()];
      const badge = document.getElementById('dayBadge');
      badge.textContent = diaSemana;
      badge.style.display = 'inline-block';

      // Acordeón: ocultar selector de fecha, mostrar resumen
      document.getElementById('dateSelectSection').style.display = 'none';
      document.getElementById('dateSummaryText').textContent = formatFechaDisplay(fecha) + ' (' + diaSemana + ')';
      document.getElementById('dateSummarySection').style.display = 'flex';

      // Revelar panel de slots
      document.getElementById('slotsPanel').style.display = 'block';

      selectedSlot = null;
      document.getElementById('confirmBtn').disabled = true;

      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('slotsContent').style.display = 'none';
      document.getElementById('loadingState').style.display = 'block';

      try {
        const resp = await fetchWithTimeout(`${N8N_BASE_URL}/webhook/public/turnos-disponibles-v2`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fecha, id_servicio: idServicio })
        });

        if (!resp.ok) throw new Error('Error del servidor');

        const data = await resp.json();
        if (data.error) throw new Error(data.error);

        renderSlots(data.availableSlots || []);
      } catch (err) {
        console.error('Error al cargar turnos:', err);
        showToast('No se pudieron cargar los horarios. Intentá de nuevo.', 'error');
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
      }
    }

    // ─── Renderizar slots (accesible) ───────────────
    function renderSlots(availableSlots) {
      const grid     = document.getElementById('slotsGrid');
      
      // Tomamos la grilla base (c/30m) y le sumamos los disponibles reales (por si hay slots de 45m, 15m, etc.)
      const baseSlots = generarHorarios();
      const allSlotsSet = new Set([...baseSlots, ...availableSlots]);
      const allSlots = Array.from(allSlotsSet).sort();

      grid.innerHTML = '';

      if (availableSlots.length === 0) {
        grid.innerHTML = '<p style="color:var(--text-secondary); grid-column: 1/-1;">No hay horarios disponibles para esta fecha.</p>';
      }

      allSlots.forEach(hora => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.classList.add('slot');
        btn.textContent = hora;

        if (!availableSlots.includes(hora)) {
          btn.classList.add('taken');
          btn.disabled = true;
          btn.setAttribute('aria-label', `Horario ${hora}, no disponible`);
        } else {
          btn.classList.add('available');
          btn.setAttribute('aria-label', `Horario ${hora}, disponible`);
          btn.setAttribute('aria-pressed', 'false');
          btn.addEventListener('click', () => selectSlot(btn, hora));
        }

        grid.appendChild(btn);
      });

      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('slotsContent').style.display = 'block';
    }

    function selectSlot(el, hora) {
      document.querySelectorAll('.slot.selected').forEach(s => {
        s.classList.remove('selected');
        s.classList.add('available');
        s.setAttribute('aria-pressed', 'false');
      });

      el.classList.remove('available');
      el.classList.add('selected');
      el.setAttribute('aria-pressed', 'true');
      selectedSlot = hora;
      document.getElementById('confirmBtn').disabled = false;
    }

    // ─── Confirmar reserva ──────────────────────────
    async function confirmarReserva() {
      const fecha = document.getElementById('fechaInput').value;
      const obs   = document.getElementById('obsInput').value.trim();

      if (!fecha || !selectedSlot) {
        showToast('Seleccioná una fecha y un horario', 'error');
        return;
      }

      const btn = document.getElementById('confirmBtn');
      btn.disabled = true;
      btn.classList.add('loading');

      const idServicio = document.getElementById('servicioInput').value;

      try {
        const resp = await fetchWithTimeout(`${N8N_BASE_URL}/webhook/public/reservar-turno-v2`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id:    sessionId,
            id_servicio:   idServicio,
            fecha:         fecha,
            hora:          selectedSlot,
            observaciones: obs || null
          })
        });

        const data = await resp.json();

        if (resp.ok && data.success) {
          document.getElementById('successFecha').textContent = formatFechaDisplay(fecha);
          document.getElementById('successHora').textContent = selectedSlot;
          document.getElementById('successOverlay').classList.add('visible');
        } else if (resp.status === 409) {
          showToast(data.message || 'Ese horario ya fue reservado. Elegí otro.', 'error');
          onFechaChange({ target: { value: fecha } });
        } else {
          showToast(data.message || 'Error al reservar. Intentá de nuevo.', 'error');
        }
      } catch (err) {
        console.error('Error al reservar:', err);
        showToast('Error de conexión. Verificá tu red.', 'error');
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
