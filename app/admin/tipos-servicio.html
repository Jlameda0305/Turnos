<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tipos de Servicio — AIONEX Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/admin-layout.css" />
  <link rel="stylesheet" href="../css/pages/admin-tables.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="bg"></div>
  
  <div class="admin-layout">
    <header class="admin-topnav"></header>

    <main class="admin-content">
      <div class="admin-header">
        <div class="admin-title">
          <h1>Tipos de Servicio</h1>
          <p>Gestión de categorías</p>
        </div>
        <div>
          <button class="submit-btn" style="padding: 0.75rem 1.5rem;" onclick="openModal()">+ Nuevo Tipo</button>
        </div>
      </div>

      <div class="table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Renderizado por JS -->
          </tbody>
        </table>

        <!-- Estado de carga -->
        <div id="loadingState" style="padding: 3rem; text-align: center;">
          <div class="mini-spinner" style="margin: 0 auto 1rem;"></div>
          <p style="color: var(--color-text-secondary);">Cargando tipos de servicio...</p>
        </div>
        
        <!-- Estado vacío -->
        <div id="emptyState" style="padding: 3rem; text-align: center; display: none;">
          <p style="color: var(--color-text-secondary);">No se encontraron tipos de servicio.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Crear/Editar -->
  <!-- Modal Crear/Editar Tipo de Servicio -->
  <dialog id="formModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <h3 style="display: flex; align-items: center; gap: 0.5rem; font-size: 1.1rem;">
          <i data-lucide="tag" style="color: var(--color-accent);"></i> <span id="modalTitle">Nuevo Tipo de Servicio</span>
        </h3>
        <button type="button" class="close-modal" onclick="closeModal()" style="background:none; border:none; color:var(--color-text-secondary); font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>
      <form id="tipoForm" style="margin-top: 1rem;">
        <input type="hidden" id="tipoId" />
        <div class="form-group" style="margin-bottom: 1rem;">
          <label style="display:block; margin-bottom:0.4rem; color:var(--color-text-secondary); font-size:0.85rem; font-family:var(--font-heading);">Nombre</label>
          <input type="text" id="nombre" class="form-control" required placeholder="Ej. Consulta General" style="width:100%; background:var(--glass-bg); border:1px solid var(--glass-border); padding:0.75rem; border-radius:var(--radius-md); color:var(--color-text-primary); font-family:inherit;" />
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label style="display:block; margin-bottom:0.4rem; color:var(--color-text-secondary); font-size:0.85rem; font-family:var(--font-heading);">Descripción</label>
          <textarea id="descripcion" class="form-control" rows="3" placeholder="Descripción opcional..." style="width:100%; background:var(--glass-bg); border:1px solid var(--glass-border); padding:0.75rem; border-radius:var(--radius-md); color:var(--color-text-primary); font-family:inherit; resize:vertical;"></textarea>
        </div>
        <div style="display: flex; gap: 1rem; justify-content: flex-end;">
          <button type="button" class="btn-secondary" onclick="closeModal()" style="padding: 0.6rem 1.4rem;">Cancelar</button>
          <button type="submit" class="submit-btn" id="saveBtn" style="width: auto; padding: 0.6rem 1.4rem;">Guardar</button>
        </div>
      </form>
    </div>
  </dialog>

  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/node-network.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/admin-utils.js"></script>
  <script>
    let currentData = [];

    document.addEventListener('DOMContentLoaded', async () => {
      renderAdminNav('tipos-servicio');
      if (!(await getAdminSessionOrRedirect())) return;
      document.getElementById('tipoForm').addEventListener('submit', saveTipo);
      cargarTipos();
    });

    async function cargarTipos() {
      const tbody = document.getElementById('tableBody');
      const loading = document.getElementById('loadingState');
      const empty = document.getElementById('emptyState');
      
      tbody.innerHTML = '';
      loading.style.display = 'block';
      empty.style.display = 'none';

      try {
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/tipos-servicio`);
        if (!resp.ok) throw new Error('Error al cargar');
        const data = await resp.json();
        
        loading.style.display = 'none';
        
        if (!data || data.length === 0 || !data[0].id_tipo_servicio) {
          empty.style.display = 'block';
        } else {
          currentData = data.filter(i => i.id_tipo_servicio);
          renderTable(currentData);
        }
      } catch (err) {
        showToast('Error al cargar tipos de servicio', 'error');
        loading.style.display = 'none';
      }
    }

    function renderTable(items) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      
      items.forEach(item => {
        const tr = document.createElement('tr');
        const descVal = safeVal(item.descripcion);

        tr.innerHTML = `
          <td><strong>${safeVal(item.nombre)}</strong></td>
          <td style="max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${descVal}">
            ${descVal}
          </td>
          <td>
            <label class="toggle-switch" title="Cambiar estado activo">
              <input type="checkbox" ${item.activo ? 'checked' : ''} onchange="toggleTipoActivo('${item.id_tipo_servicio}', this.checked, this)">
              <span class="toggle-slider"></span>
            </label>
          </td>
          <td>
            <div class="actions-cell">
              <button class="btn-icon" title="Editar" onclick="editTipo('${item.id_tipo_servicio}')"><i data-lucide="pencil"></i></button>
              <button class="btn-icon danger" title="Eliminar" onclick="deleteTipo('${item.id_tipo_servicio}')"><i data-lucide="trash-2"></i></button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
      refreshIcons(tbody);
    }

    async function toggleTipoActivo(id, nuevoEstado, checkboxEl) {
      const item = currentData.find(i => i.id_tipo_servicio === id);
      if (!item) return;

      try {
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/tipo-servicio-editar`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: item.id_tipo_servicio,
            id_tipo_servicio: item.id_tipo_servicio,
            nombre: item.nombre,
            descripcion: item.descripcion,
            activo: nuevoEstado
          })
        });

        if (!resp.ok) throw new Error('Error al actualizar estado');
        item.activo = nuevoEstado;
        showToast(`Tipo de servicio ${nuevoEstado ? 'activado' : 'desactivado'} correctamente`, 'success');
      } catch (err) {
        showToast(err.message || 'Error al cambiar estado', 'error');
        if (checkboxEl) checkboxEl.checked = !nuevoEstado;
      }
    }

    function openModal() {
      document.getElementById('tipoId').value = '';
      document.getElementById('nombre').value = '';
      document.getElementById('descripcion').value = '';
      document.getElementById('modalTitle').textContent = 'Nuevo Tipo de Servicio';
      
      const modal = document.getElementById('formModal');
      modal.showModal();
      refreshIcons(modal);
    }

    function editTipo(id) {
      const item = currentData.find(i => i.id_tipo_servicio === id);
      if (!item) return;

      document.getElementById('tipoId').value = item.id_tipo_servicio;
      document.getElementById('nombre').value = item.nombre;
      document.getElementById('descripcion').value = item.descripcion || '';
      document.getElementById('modalTitle').textContent = 'Editar Tipo de Servicio';
      
      const modal = document.getElementById('formModal');
      modal.showModal();
      refreshIcons(modal);
    }

    function closeModal() {
      document.getElementById('formModal').close();
    }

    async function saveTipo(e) {
      e.preventDefault();
      const id = document.getElementById('tipoId').value;
      const nombre = document.getElementById('nombre').value.trim();
      const descripcion = document.getElementById('descripcion').value.trim();

      const existingItem = currentData.find(i => i.id_tipo_servicio === id);
      const activo = existingItem ? existingItem.activo : true;

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      try {
        let resp;
        if (id) {
          resp = await adminFetch(`${ADMIN_N8N_PREFIX}/tipo-servicio-editar`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, id_tipo_servicio: id, nombre, descripcion, activo })
          });
        } else {
          resp = await adminFetch(`${ADMIN_N8N_PREFIX}/tipo-servicio-crear`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, descripcion })
          });
        }

        if (!resp.ok) {
          const errData = await resp.json();
          throw new Error(errData.message || 'Error al guardar');
        }

        showToast('Guardado exitosamente', 'success');
        closeModal();
        cargarTipos();
      } catch (err) {
        showToast(err.message || 'Hubo un error', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar';
      }
    }

    async function deleteTipo(id) {
      if (!confirm('⚠ ADVERTENCIA: Al eliminar este tipo de servicio, se eliminarán en cascada TODOS los servicios asociados a él. ¿Estás seguro de que querés continuar?')) return;

      try {
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/tipo-servicio-eliminar`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id_tipo_servicio: id })
        });

        if (!resp.ok) {
          const errData = await resp.json();
          throw new Error(errData.message || 'Error al eliminar');
        }

        showToast('Tipo de servicio eliminado', 'success');
        cargarTipos();
      } catch (err) {
        showToast(err.message || 'Hubo un error al eliminar', 'error');
      }
    }
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
