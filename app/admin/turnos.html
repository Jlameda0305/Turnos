<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turnos — AIONEX Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/admin-layout.css" />
  <link rel="stylesheet" href="../css/pages/admin-tables.css" />
</head>
<body>
  <div class="bg"></div>
  
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand">
        <div class="brand-icon">A</div>
        <span class="brand-name">AIONEX</span>
      </div>
      <nav class="nav-links">
        <a href="dashboard.html" class="nav-link">
          <span class="icon">📊</span>
          Dashboard
        </a>
        <a href="turnos.html" class="nav-link active">
          <span class="icon">🗓️</span>
          Turnos
        </a>
        <a href="clientes.html" class="nav-link">
          <span class="icon">👥</span>
          Clientes
        </a>
      </nav>
      <div style="margin-top: auto;">
        <button class="nav-link" id="logoutBtn" style="width: 100%; border: none; cursor: pointer; text-align: left; background: transparent;">
          <span class="icon">🚪</span>
          Cerrar Sesión
        </button>
      </div>
    </aside>

    <main class="admin-content">
      <div class="admin-header">
        <div class="admin-title">
          <h1>Gestión de Turnos</h1>
          <p>Control de agenda y reservas</p>
        </div>
        <div>
          <a href="nuevo-turno.html" class="submit-btn" style="text-decoration:none; padding: 0.75rem 1.5rem; display:inline-block;">+ Nuevo Turno</a>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-estado="todos">Todos</button>
        <button class="tab-btn" data-estado="pendiente">Pendientes</button>
        <button class="tab-btn" data-estado="confirmado">Confirmados</button>
        <button class="tab-btn" data-estado="cancelado">Cancelados</button>
        <button class="tab-btn" data-estado="completado">Completados</button>
      </div>

      <div class="table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Observaciones</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="turnosTableBody">
            <!-- Renderizado por JS -->
          </tbody>
        </table>

        <div id="loadingState" style="padding: 3rem; text-align: center;">
          <div class="mini-spinner" style="margin: 0 auto 1rem;"></div>
          <p style="color: rgba(255,255,255,0.6);">Cargando agenda...</p>
        </div>
        
        <div id="emptyState" style="padding: 3rem; text-align: center; display: none;">
          <p style="color: rgba(255,255,255,0.6);">No hay turnos para mostrar en esta vista.</p>
        </div>

        <div class="pagination">
          <div class="page-info">Mostrando <span id="pageStart">0</span> - <span id="pageEnd">0</span> de <span id="totalItems">0</span></div>
          <div class="page-controls">
            <button class="page-btn" id="prevPageBtn" disabled>Anterior</button>
            <button class="page-btn" id="nextPageBtn" disabled>Siguiente</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/admin-utils.js"></script>
  <script>
    let currentPage = 1;
    let currentLimit = 10;
    let currentFilter = 'todos';

    document.addEventListener('DOMContentLoaded', async () => {
      if (!(await getAdminSessionOrRedirect())) return;
      document.getElementById('logoutBtn').addEventListener('click', adminLogout);
      
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentFilter = e.target.dataset.estado;
          currentPage = 1;
          cargarTurnos();
        });
      });

      document.getElementById('prevPageBtn').addEventListener('click', () => { currentPage--; cargarTurnos(); });
      document.getElementById('nextPageBtn').addEventListener('click', () => { currentPage++; cargarTurnos(); });

      cargarTurnos();
    });

    async function cargarTurnos() {
      const tbody = document.getElementById('turnosTableBody');
      const loading = document.getElementById('loadingState');
      const empty = document.getElementById('emptyState');
      
      tbody.innerHTML = '';
      loading.style.display = 'block';
      empty.style.display = 'none';
      document.getElementById('prevPageBtn').disabled = true;
      document.getElementById('nextPageBtn').disabled = true;

      try {
        const offset = (currentPage - 1) * currentLimit;
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/turnos?estado=${currentFilter}&limit=${currentLimit}&offset=${offset}`);
        
        if (!resp.ok) throw new Error('Error al cargar turnos');
        const data = await resp.json();
        
        loading.style.display = 'none';

        if (!data.data || data.data.length === 0 || !data.data[0].id_turno) {
          empty.style.display = 'block';
        } else {
          renderTable(data.data.filter(t => t.id_turno));
        }
        
        updatePagination(data.total || 0, (data.data || []).length);

      } catch (err) {
        showToast('Error al cargar turnos', 'error');
        loading.style.display = 'none';
      }
    }

    function renderTable(turnos) {
      const tbody = document.getElementById('turnosTableBody');
      tbody.innerHTML = '';
      
      turnos.forEach(t => {
        const tr = document.createElement('tr');
        
        const clienteNombre = `${t.cliente.nombre} ${t.cliente.apellido}`;
        
        // Dropdown de estados
        const estados = ['pendiente', 'confirmado', 'cancelado', 'completado'];
        let selectHtml = `<select class="status-select" onchange="cambiarEstado('${t.id_turno}', this.value)" style="border-color: ${getColorPorEstado(t.estado)}">`;
        estados.forEach(est => {
          selectHtml += `<option value="${est}" ${t.estado === est ? 'selected' : ''}>${est}</option>`;
        });
        selectHtml += `</select>`;

        tr.innerHTML = `
          <td>
            <strong>${clienteNombre}</strong><br>
            <span style="font-size:0.8rem; color:rgba(255,255,255,0.5)">DNI: ${t.cliente.dni}</span>
          </td>
          <td>${formatFechaDisplay(t.fecha)}</td>
          <td>${formatHoraDisplay(t.hora)}</td>
          <td style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${t.observaciones || ''}">
            ${t.observaciones || '<span style="color:rgba(255,255,255,0.3)">-</span>'}
          </td>
          <td>${selectHtml}</td>
          <td>
            <div class="actions-cell">
              <button class="btn-icon danger" title="Eliminar Turno" onclick="eliminarTurno('${t.id_turno}')">🗑️</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function getColorPorEstado(estado) {
      if (estado === 'confirmado') return 'var(--color-indigo)';
      if (estado === 'cancelado') return '#ef4444';
      if (estado === 'completado') return '#10b981';
      return 'rgba(255,255,255,0.4)';
    }

    async function cambiarEstado(idTurno, nuevoEstado) {
      try {
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/turno-estado?id=${idTurno}`, { 
          method: 'PATCH', 
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ estado: nuevoEstado }) 
        });
        if (!resp.ok) throw new Error('Error al actualizar estado');
        showToast('Estado actualizado', 'success');
        
        // Reload si estamos en una pestaña filtrada
        if (currentFilter !== 'todos') {
          setTimeout(cargarTurnos, 500);
        }
      } catch (err) {
        showToast('Error al actualizar estado', 'error');
      }
    }

    async function eliminarTurno(idTurno) {
      if (!confirm('¿Estás seguro de que deseas eliminar este turno? Esta acción no se puede deshacer.')) return;
      
      try {
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/turno-eliminar?id=${idTurno}`, { method: 'DELETE' });
        if (!resp.ok) throw new Error('Error al eliminar');
        showToast('Turno eliminado correctamente', 'success');
        cargarTurnos();
      } catch (err) {
        showToast('Error al eliminar turno', 'error');
      }
    }

    function updatePagination(total, currentCount) {
      const start = (currentPage - 1) * currentLimit + (currentCount > 0 ? 1 : 0);
      const end = start + currentCount - 1;
      
      document.getElementById('pageStart').textContent = start;
      document.getElementById('pageEnd').textContent = end > 0 ? end : 0;
      document.getElementById('totalItems').textContent = total;

      document.getElementById('prevPageBtn').disabled = currentPage === 1;
      document.getElementById('nextPageBtn').disabled = end >= total;
    }
  </script>
</body>
</html>
