<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — AIONEX Turnos</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  
  <style>
    /* Estilos específicos para el login centrado */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .admin-badge {
      display: inline-block;
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>

  <div class="card">
    <div class="header">
      <div class="brand">
        <div class="brand-icon">A</div>
        <span class="brand-name">AIONEX</span>
      </div>
      <div class="admin-badge">Panel de Administración</div>
      <h1>Ingreso Dueño</h1>
      <p>Autenticación requerida para acceder al sistema</p>
    </div>

    <form id="adminLoginForm" class="form-grid" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="admin@aionex.com" required autofocus />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-text">Ingresar</span>
        <div class="btn-spinner"></div>
      </button>
    </form>
  </div>

  <div class="toast" id="toast" aria-live="polite"></div>

  <!-- CDN de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Utils -->
  <script src="../js/utils.js"></script>
  <script src="../js/admin-utils.js"></script>
  <script>
    // Si ya tiene sesión, mandarlo directo al dashboard
    document.addEventListener('DOMContentLoaded', async () => {
      if (supabaseClient) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
          window.location.href = 'dashboard.html';
        }
      }
    });

    const form = document.getElementById('adminLoginForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showToast('Completá ambos campos', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.classList.add('loading');

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          showToast('Credenciales incorrectas', 'error');
          submitBtn.disabled = false;
          submitBtn.classList.remove('loading');
          return;
        }

        if (data.session) {
          showToast('Ingreso exitoso', 'success');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
        }
      } catch (err) {
        console.error('Error de Auth:', err);
        showToast('Error de conexión. Intentá nuevamente.', 'error');
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
