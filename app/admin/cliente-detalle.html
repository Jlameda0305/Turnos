<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle Cliente — AIONEX Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/admin-layout.css" />
  <link rel="stylesheet" href="../css/pages/admin-tables.css" />
  <style>
    .client-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 1.5rem 2rem;
      border-radius: var(--radius-lg);
      margin-bottom: 1.5rem;
      backdrop-filter: blur(10px);
      flex-wrap: wrap;
    }
    .client-hero-left {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    .client-avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--color-bg-surface);
      border: 2px solid var(--color-accent);
      color: var(--color-accent);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-heading);
      font-size: 1.4rem; font-weight: 600;
      box-shadow: var(--glow-plateado);
      flex-shrink: 0;
    }
    .client-hero-name {
      font-family: var(--font-heading);
      font-size: 1.5rem; font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 0.2rem;
    }
    .client-hero-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--color-text-secondary);
      font-size: 0.85rem;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 2rem;
      border-radius: var(--radius-lg);
      margin-bottom: 2rem;
      transition: border-color var(--transition-default), box-shadow var(--transition-default);
    }
    .detail-grid.editing {
      border-color: var(--color-accent);
      box-shadow: 0 0 20px rgba(201, 204, 209, 0.12);
    }
    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .detail-item label {
      font-size: 0.82rem;
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-family: var(--font-heading);
      font-weight: 500;
    }
    .detail-item input, .detail-item select {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--color-text-primary);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.95rem;
      transition: all var(--transition-fast);
    }
    .detail-item input:disabled, .detail-item select:disabled {
      background: rgba(255, 255, 255, 0.02);
      border-color: rgba(255, 255, 255, 0.05);
      padding: 0.75rem 1rem;
      opacity: 0.9;
      cursor: not-allowed;
    }
    .detail-item input:not(:disabled):focus, .detail-item select:not(:disabled):focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(201,204,209,.12);
      outline: none;
    }
    .form-actions {
      display: flex;
      gap: 1rem;
      grid-column: 1 / -1;
      justify-content: flex-end;
      margin-top: 1rem;
    }
    @media (max-width: 640px) {
      .detail-grid { grid-template-columns: 1fr; }
      .client-hero { flex-direction: column; align-items: flex-start; }
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="bg"></div>
  
  <div class="admin-layout">
    <header class="admin-topnav"></header>

    <main class="admin-content">
      <div class="admin-header" style="margin-bottom: 1rem;">
        <div class="admin-title">
          <a href="clientes.html" style="color:var(--color-indigo-light); text-decoration:none; font-size: 0.9rem; display:inline-block; margin-bottom: 0.5rem;">← Volver a Clientes</a>
        </div>
      </div>

      <div id="loadingState" style="padding: 3rem; text-align: center;">
        <div class="mini-spinner" style="margin: 0 auto 1rem;"></div>
        <p style="color: var(--color-text-secondary);">Cargando información...</p>
      </div>

      <div id="contentState" style="display:none;">
        <!-- Hero Card del Cliente -->
        <div class="client-hero">
          <div class="client-hero-left">
            <div class="client-avatar" id="clientAvatarHero">C</div>
            <div>
              <div class="client-hero-name" id="pageTitle">Detalle del Cliente</div>
              <div class="client-hero-meta">
                <span>DNI: <strong id="heroDni" style="color: var(--color-text-primary);">—</strong></span>
                <span>•</span>
                <span id="heroEmail" style="color: var(--color-text-secondary);">—</span>
              </div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 1rem;">
            <a id="btnWhatsAppHeader" href="#" target="_blank" rel="noopener" class="btn-secondary" style="display: none; align-items: center; gap: 0.4rem; color: #25D366; border-color: rgba(37, 211, 102, 0.3); text-decoration: none; padding: 0.5rem 1rem; font-size: 0.85rem;" title="Abrir chat de WhatsApp">
              <i data-lucide="message-circle"></i> WhatsApp
            </a>
            <label class="toggle-switch" title="Cambiar estado del cliente">
              <input type="checkbox" id="toggleClienteActivo">
              <span class="toggle-slider"></span>
              <span id="labelClienteActivo" style="font-size: 0.9rem; font-weight: 600; color: var(--color-text-primary); min-width: 60px;">Activo</span>
            </label>
          </div>
        </div>
        <!-- Formulario -->
        <form id="clienteForm" class="detail-grid">
          <div class="detail-item">
            <label>DNI <span title="Campo fijo por seguridad, no se puede editar" style="cursor:help; font-size: 0.8rem; margin-left: 0.25rem;">🔒</span></label>
            <input type="text" id="dni" disabled />
          </div>
          <div class="detail-item">
            <label>Email <span title="Campo fijo por seguridad, no se puede editar" style="cursor:help; font-size: 0.8rem; margin-left: 0.25rem;">🔒</span></label>
            <input type="email" id="email" disabled />
          </div>
          <div class="detail-item">
            <label>Nombre</label>
            <input type="text" id="nombre" disabled />
          </div>
          <div class="detail-item">
            <label>Apellido</label>
            <input type="text" id="apellido" disabled />
          </div>
          <div class="detail-item">
            <label>Sexo</label>
            <select id="sexo" disabled>
              <option value="M">Masculino</option>
              <option value="F">Femenino</option>
              <option value="X">No especifica</option>
            </select>
          </div>
          <div class="detail-item">
            <label>Fecha de Nacimiento</label>
            <input type="date" id="fecha_nacimiento" disabled />
          </div>
          <div class="detail-item">
            <label>Teléfono</label>
            <input type="text" id="telefono" disabled />
          </div>
          <div class="detail-item">
            <label>Dirección</label>
            <input type="text" id="direccion" disabled />
          </div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" id="editBtn">Editar Datos</button>
            <button type="button" class="btn-secondary" id="cancelBtn" style="display:none;">Cancelar</button>
            <button type="submit" class="submit-btn" id="saveBtn" style="display:none; padding: 0.75rem 1.5rem; width: auto;">Guardar Cambios</button>
          </div>
        </form>

        <!-- Turnos Recientes -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h2 style="font-size: 1.1rem; margin: 0;">Últimos Turnos (Historial)</h2>
          <a id="btnVerTodosTurnos" href="#" class="btn-secondary" style="font-size: 0.85rem; padding: 0.25rem 0.75rem; text-decoration: none;" title="Ver todos los turnos de este cliente en la agenda">Ver historial completo</a>
        </div>
        <div class="table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Hora</th>
                <th>Estado</th>
                <th>Observaciones</th>
              </tr>
            </thead>
            <tbody id="turnosTableBody">
              <!-- JS -->
            </tbody>
          </table>
          <div id="emptyTurnos" style="padding: 2rem; text-align: center; display: none;">
            <p style="color: var(--color-text-secondary);">El cliente no tiene turnos registrados.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/node-network.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/admin-utils.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const clientId = urlParams.get('id');
    let isEditing = false;
    let originalData = {};

    document.addEventListener('DOMContentLoaded', async () => {
      renderAdminNav('cliente-detalle');
      if (!(await getAdminSessionOrRedirect())) return;
      
      if (!clientId) {
        window.location.href = 'clientes.html';
        return;
      }

      document.getElementById('editBtn').addEventListener('click', toggleEdit);
      document.getElementById('cancelBtn').addEventListener('click', cancelEdit);
      document.getElementById('clienteForm').addEventListener('submit', saveChanges);

      cargarDetalle();
    });

    async function cargarDetalle() {
      try {
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/cliente-detalle?id=${clientId}`);
        if (!resp.ok) throw new Error('Error al cargar detalle');
        
        const data = await resp.json();
        
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('contentState').style.display = 'block';

        originalData = { ...data };
        fillForm(data);
        renderTurnos(data.turnos || []);
        
        document.getElementById('btnVerTodosTurnos').href = `turnos.html?cliente=${encodeURIComponent(data.dni)}`;

        // Configurar WhatsApp
        const waUrl = buildWhatsAppUrl(data.telefono);
        const waBtn = document.getElementById('btnWhatsAppHeader');
        if (waBtn) {
          if (waUrl) {
            waBtn.href = waUrl;
            waBtn.style.display = 'inline-flex';
          } else {
            waBtn.style.display = 'none';
          }
        }

        // Configurar Toggle Activo/Inactivo
        const toggle = document.getElementById('toggleClienteActivo');
        const label = document.getElementById('labelClienteActivo');
        if (toggle && label) {
          const isActivo = data.activo !== false;
          toggle.checked = isActivo;
          label.textContent = isActivo ? 'Activo' : 'Inactivo';
          label.style.color = isActivo ? 'var(--color-success-text)' : 'var(--color-error-text)';

          toggle.onchange = async (e) => {
            const isChecked = e.target.checked;
            label.textContent = isChecked ? 'Activo' : 'Inactivo';
            label.style.color = isChecked ? 'var(--color-success-text)' : 'var(--color-error-text)';

            try {
              const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/clientes/${clientId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ activo: isChecked })
              });
              if (!resp.ok) throw new Error('Error al actualizar estado');
              showToast(`Cliente ${isChecked ? 'activado' : 'desactivado'} correctamente`, 'success');
              originalData.activo = isChecked;
            } catch (err) {
              showToast('Error al actualizar estado', 'error');
              toggle.checked = !isChecked;
              label.textContent = !isChecked ? 'Activo' : 'Inactivo';
              label.style.color = !isChecked ? 'var(--color-success-text)' : 'var(--color-error-text)';
            }
          };
        }
        
        if (urlParams.get('edit') === 'true') {
          toggleEdit();
        }

      } catch (err) {
        showToast('Error al cargar detalle', 'error');
      }
    }

    function fillForm(data) {
      const fullName = safeVal(`${data.nombre || ''} ${data.apellido || ''}`.trim(), 'Cliente');
      document.getElementById('pageTitle').textContent = fullName;
      
      const heroDni = document.getElementById('heroDni');
      if (heroDni) heroDni.textContent = safeVal(data.dni);
      
      const heroEmail = document.getElementById('heroEmail');
      if (heroEmail) heroEmail.textContent = safeVal(data.email);
      
      const initials = `${(data.nombre || '').charAt(0)}${(data.apellido || '').charAt(0)}`.toUpperCase() || 'C';
      const avatarEl = document.getElementById('clientAvatarHero');
      if (avatarEl) avatarEl.textContent = initials;

      document.getElementById('dni').value = safeVal(data.dni, '');
      document.getElementById('email').value = safeVal(data.email, '');
      document.getElementById('nombre').value = safeVal(data.nombre, '');
      document.getElementById('apellido').value = safeVal(data.apellido, '');
      document.getElementById('sexo').value = safeVal(data.sexo, 'X');
      document.getElementById('fecha_nacimiento').value = safeVal(data.fecha_nacimiento, '');
      document.getElementById('telefono').value = safeVal(data.telefono, '');
      document.getElementById('direccion').value = safeVal(data.direccion, '');
    }

    function renderTurnos(turnos) {
      const tbody = document.getElementById('turnosTableBody');
      const empty = document.getElementById('emptyTurnos');
      tbody.innerHTML = '';

      if (!turnos || turnos.length === 0) {
        empty.style.display = 'block';
        return;
      }

      turnos.forEach(t => {
        const tr = document.createElement('tr');
        const statusClass = 'status-badge--' + (t.estado || 'pendiente').toLowerCase();
        
        tr.innerHTML = `
          <td>${formatFechaDisplay(t.fecha)}</td>
          <td>${formatHoraDisplay(t.hora)}</td>
          <td>
            <span class="status-badge ${statusClass}">
              ${safeVal(t.estado, 'pendiente')}
            </span>
          </td>
          <td>${safeVal(t.observaciones)}</td>
        `;
        tbody.appendChild(tr);
      });
      refreshIcons(tbody);
    }

    function toggleEdit() {
      isEditing = true;
      const form = document.getElementById('clienteForm');
      if (form) form.classList.add('editing');

      const inputs = document.querySelectorAll('#clienteForm input, #clienteForm select');
      inputs.forEach(el => {
        if (el.id !== 'dni' && el.id !== 'email') el.disabled = false;
      });
      document.getElementById('editBtn').style.display = 'none';
      document.getElementById('cancelBtn').style.display = 'block';
      document.getElementById('saveBtn').style.display = 'block';
    }

    function cancelEdit() {
      isEditing = false;
      const form = document.getElementById('clienteForm');
      if (form) form.classList.remove('editing');

      fillForm(originalData);
      const inputs = document.querySelectorAll('#clienteForm input, #clienteForm select');
      inputs.forEach(el => el.disabled = true);
      
      document.getElementById('editBtn').style.display = 'block';
      document.getElementById('cancelBtn').style.display = 'none';
      document.getElementById('saveBtn').style.display = 'none';
    }

    async function saveChanges(e) {
      e.preventDefault();
      
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      const payload = {
        nombre: document.getElementById('nombre').value,
        apellido: document.getElementById('apellido').value,
        sexo: document.getElementById('sexo').value,
        fecha_nacimiento: document.getElementById('fecha_nacimiento').value,
        telefono: document.getElementById('telefono').value,
        direccion: document.getElementById('direccion').value,
      };

      try {
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/clientes/${clientId}`, { method: 'PUT', body: JSON.stringify(payload) });
        if (!resp.ok) throw new Error('Error al actualizar');
        
        showToast('Datos actualizados correctamente', 'success');
        originalData = { ...originalData, ...payload };
        cancelEdit();
        btn.disabled = false;
        btn.textContent = 'Guardar Cambios';
        document.getElementById('pageTitle').textContent = `${originalData.nombre} ${originalData.apellido}`;
      } catch (err) {
        showToast('Error al actualizar', 'error');
        btn.disabled = false;
        btn.textContent = 'Guardar Cambios';
      }
    }
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
