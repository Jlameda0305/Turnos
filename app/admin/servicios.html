<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servicios — AIONEX Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/admin-layout.css" />
  <link rel="stylesheet" href="../css/pages/admin-tables.css" />
</head>
<body>
  <div class="bg"></div>
  
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand">
        <div class="brand-icon">A</div>
        <span class="brand-name">AIONEX</span>
      </div>

      <nav class="nav-links">
        <a href="dashboard.html" class="nav-link">
          <span class="icon">📊</span>
          Dashboard
        </a>
        <a href="turnos.html" class="nav-link">
          <span class="icon">🗓️</span>
          Turnos
        </a>
        <a href="clientes.html" class="nav-link">
          <span class="icon">👥</span>
          Clientes
        </a>
        <a href="servicios.html" class="nav-link active">
          <span class="icon">⚙️</span>
          Servicios
        </a>
        <a href="tipos-servicio.html" class="nav-link">
          <span class="icon">🏷️</span>
          Tipos de Servicio
        </a>
      </nav>
      
      <div style="margin-top: auto;">
        <button class="nav-link" id="logoutBtn" style="width: 100%; border: none; cursor: pointer; text-align: left; background: transparent;">
          <span class="icon">🚪</span>
          Cerrar Sesión
        </button>
      </div>
    </aside>

    <main class="admin-content">
      <div class="admin-header">
        <div class="admin-title">
          <h1>Servicios</h1>
          <p>Catálogo de servicios disponibles</p>
        </div>
        <div>
          <button class="submit-btn" style="padding: 0.75rem 1.5rem;" onclick="openModal()">+ Nuevo Servicio</button>
        </div>
      </div>

      <div class="table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Tipo</th>
              <th>Duración</th>
              <th>Costo</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Renderizado por JS -->
          </tbody>
        </table>

        <!-- Estado de carga -->
        <div id="loadingState" style="padding: 3rem; text-align: center;">
          <div class="mini-spinner" style="margin: 0 auto 1rem;"></div>
          <p style="color: rgba(255,255,255,0.6);">Cargando servicios...</p>
        </div>
        
        <!-- Estado vacío -->
        <div id="emptyState" style="padding: 3rem; text-align: center; display: none;">
          <p style="color: rgba(255,255,255,0.6);">No se encontraron servicios.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Crear/Editar -->
  <div class="modal-overlay" id="formModal">
    <div class="modal-card">
      <div class="modal-title" id="modalTitle">Nuevo Servicio</div>
      <form id="servicioForm">
        <input type="hidden" id="servicioId" />
        <div class="field">
          <label for="id_tipo_servicio">Tipo de Servicio</label>
          <select id="id_tipo_servicio" required>
            <option value="">Cargando tipos...</option>
          </select>
        </div>
        <div class="field">
          <label for="nombre">Nombre del Servicio</label>
          <input type="text" id="nombre" required placeholder="Ej. Consulta Pediátrica" />
        </div>
        <div class="field">
          <label for="duracion">Duración (minutos)</label>
          <input type="number" id="duracion" required min="1" placeholder="Ej. 30, 45, 60" />
        </div>
        <div class="field">
          <label for="costo">Costo ($)</label>
          <input type="number" id="costo" required min="0" step="any" placeholder="Ej. 1500" />
        </div>
        <div class="field" id="activoField" style="display: none; align-items: center; gap: 0.5rem; flex-direction: row;">
          <input type="checkbox" id="activo" checked />
          <label for="activo" style="margin: 0;">Activo</label>
        </div>
        <div class="modal-actions" style="margin-top: 1.5rem;">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="submit-btn" id="saveBtn">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/admin-utils.js"></script>
  <script>
    let currentData = [];
    let tiposServicio = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!(await getAdminSessionOrRedirect())) return;
      document.getElementById('logoutBtn').addEventListener('click', adminLogout);
      document.getElementById('servicioForm').addEventListener('submit', saveServicio);
      
      cargarTipos(); // Para el select del modal
      cargarServicios(); // Para la tabla
    });

    async function cargarTipos() {
      try {
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/tipos-servicio`);
        if (resp.ok) {
          const data = await resp.json();
          // Filtramos solo los activos para mostrarlos en el select, aunque para editar tal vez queramos todos.
          tiposServicio = data.filter(i => i.id_tipo_servicio);
          
          const select = document.getElementById('id_tipo_servicio');
          select.innerHTML = '<option value="">Seleccione un tipo...</option>';
          tiposServicio.filter(t => t.activo).forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.id_tipo_servicio;
            opt.textContent = t.nombre;
            select.appendChild(opt);
          });
        }
      } catch (err) {
        console.warn('Error al cargar tipos para el select', err);
      }
    }

    async function cargarServicios() {
      const tbody = document.getElementById('tableBody');
      const loading = document.getElementById('loadingState');
      const empty = document.getElementById('emptyState');
      
      tbody.innerHTML = '';
      loading.style.display = 'block';
      empty.style.display = 'none';

      try {
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/servicios`);
        if (!resp.ok) throw new Error('Error al cargar');
        const data = await resp.json();
        
        loading.style.display = 'none';
        
        if (!data || data.length === 0 || !data[0].id_servicio) {
          empty.style.display = 'block';
        } else {
          currentData = data.filter(i => i.id_servicio);
          renderTable(currentData);
        }
      } catch (err) {
        showToast('Error al cargar servicios', 'error');
        loading.style.display = 'none';
      }
    }

    function renderTable(items) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      
      items.forEach(item => {
        const tr = document.createElement('tr');
        
        const badgeClass = item.activo ? 'badge-confirmado' : 'badge-cancelado';
        const badgeText = item.activo ? 'Activo' : 'Inactivo';

        tr.innerHTML = `
          <td><strong>${item.nombre}</strong></td>
          <td><span style="color:var(--text-secondary)">${item.tipo_nombre || '-'}</span></td>
          <td>⏱ ${item.duracion} min</td>
          <td>$${item.costo}</td>
          <td><span class="turno-badge ${badgeClass}">${badgeText}</span></td>
          <td>
            <div class="actions-cell">
              <button class="btn-icon" title="Editar" onclick="editServicio('${item.id_servicio}')">✏️</button>
              <button class="btn-icon" title="Eliminar" style="color: #ff4444;" onclick="deleteServicio('${item.id_servicio}')">🗑️</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openModal() {
      document.getElementById('servicioId').value = '';
      document.getElementById('id_tipo_servicio').value = '';
      document.getElementById('nombre').value = '';
      document.getElementById('duracion').value = '30';
      document.getElementById('costo').value = '';
      document.getElementById('activo').checked = true;
      document.getElementById('activoField').style.display = 'none';
      document.getElementById('modalTitle').textContent = 'Nuevo Servicio';
      document.getElementById('formModal').classList.add('visible');
    }

    function editServicio(id) {
      const item = currentData.find(i => i.id_servicio === id);
      if (!item) return;

      // Si el tipo actual está inactivo y no está en la lista de options, lo agregamos temporalmente
      const select = document.getElementById('id_tipo_servicio');
      if (!Array.from(select.options).some(opt => opt.value === item.id_tipo_servicio)) {
        const opt = document.createElement('option');
        opt.value = item.id_tipo_servicio;
        opt.textContent = item.tipo_nombre + ' (Inactivo)';
        select.appendChild(opt);
      }

      document.getElementById('servicioId').value = item.id_servicio;
      document.getElementById('id_tipo_servicio').value = item.id_tipo_servicio;
      document.getElementById('nombre').value = item.nombre;
      document.getElementById('duracion').value = item.duracion;
      document.getElementById('costo').value = item.costo;
      document.getElementById('activo').checked = item.activo;
      document.getElementById('activoField').style.display = 'flex';
      document.getElementById('modalTitle').textContent = 'Editar Servicio';
      document.getElementById('formModal').classList.add('visible');
    }

    function closeModal() {
      document.getElementById('formModal').classList.remove('visible');
    }

    async function saveServicio(e) {
      e.preventDefault();
      const id = document.getElementById('servicioId').value;
      const id_tipo_servicio = document.getElementById('id_tipo_servicio').value;
      const nombre = document.getElementById('nombre').value.trim();
      const duracion = parseInt(document.getElementById('duracion').value, 10);
      const costo = parseFloat(document.getElementById('costo').value);
      const activo = document.getElementById('activo').checked;

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      try {
        let resp;
        if (id) {
          resp = await adminFetch(`${ADMIN_N8N_PREFIX}/servicio-editar`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id_servicio: id, id_tipo_servicio, nombre, duracion, costo, activo })
          });
        } else {
          resp = await adminFetch(`${ADMIN_N8N_PREFIX}/servicio-crear`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id_tipo_servicio, nombre, duracion, costo })
          });
        }

        if (!resp.ok) {
          const errData = await resp.json();
          throw new Error(errData.message || 'Error al guardar');
        }

        showToast('Guardado exitosamente', 'success');
        closeModal();
        cargarServicios();
      } catch (err) {
        showToast(err.message || 'Hubo un error', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar';
      }
    }

    async function deleteServicio(id) {
      if (!confirm('¿Estás seguro de que querés eliminar este servicio?')) return;

      try {
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/servicio-eliminar`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id_servicio: id })
        });

        if (!resp.ok) {
          const errData = await resp.json();
          throw new Error(errData.message || 'Error al eliminar');
        }

        showToast('Servicio eliminado', 'success');
        cargarServicios();
      } catch (err) {
        showToast(err.message || 'Hubo un error al eliminar', 'error');
      }
    }
  </script>
</body>
</html>
