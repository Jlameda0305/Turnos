<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servicios — AIONEX Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/admin-layout.css" />
  <link rel="stylesheet" href="../css/pages/admin-tables.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="bg"></div>
  
  <div class="admin-layout">
    <header class="admin-topnav"></header>

    <main class="admin-content">
      <div class="admin-header">
        <div class="admin-title">
          <h1>Servicios</h1>
          <p>Catálogo de servicios disponibles</p>
        </div>
        <div>
          <button class="submit-btn" style="padding: 0.75rem 1.5rem;" onclick="openModal()">+ Nuevo Servicio</button>
        </div>
      </div>

      <div class="table-container">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Tipo</th>
              <th>Duración</th>
              <th>Costo</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Renderizado por JS -->
          </tbody>
        </table>

        <!-- Estado de carga -->
        <div id="loadingState" style="padding: 3rem; text-align: center;">
          <div class="mini-spinner" style="margin: 0 auto 1rem;"></div>
          <p style="color: var(--color-text-secondary);">Cargando servicios...</p>
        </div>
        
        <!-- Estado vacío -->
        <div id="emptyState" style="padding: 3rem; text-align: center; display: none;">
          <p style="color: var(--color-text-secondary);">No se encontraron servicios.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Crear/Editar Servicio -->
  <dialog id="formModal" class="modal">
    <div class="modal-content" style="max-width: 520px;">
      <div class="modal-header">
        <h3 style="display: flex; align-items: center; gap: 0.5rem; font-size: 1.1rem;">
          <i data-lucide="wrench" style="color: var(--color-accent);"></i> <span id="modalTitle">Nuevo Servicio</span>
        </h3>
        <button type="button" class="close-modal" onclick="closeModal()" style="background:none; border:none; color:var(--color-text-secondary); font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>
      <form id="servicioForm" style="margin-top: 1rem;">
        <input type="hidden" id="servicioId" />
        <div class="form-group" style="margin-bottom: 1rem;">
          <label style="display:block; margin-bottom:0.4rem; color:var(--color-text-secondary); font-size:0.85rem; font-family:var(--font-heading);">Tipo de Servicio</label>
          <select id="id_tipo_servicio" class="form-control" required style="width:100%; background:var(--glass-bg); border:1px solid var(--glass-border); padding:0.75rem; border-radius:var(--radius-md); color:var(--color-text-primary); font-family:inherit;">
            <option value="">Cargando tipos...</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
          <label style="display:block; margin-bottom:0.4rem; color:var(--color-text-secondary); font-size:0.85rem; font-family:var(--font-heading);">Nombre del Servicio</label>
          <input type="text" id="nombre" class="form-control" required placeholder="Ej. Consulta Pediátrica" style="width:100%; background:var(--glass-bg); border:1px solid var(--glass-border); padding:0.75rem; border-radius:var(--radius-md); color:var(--color-text-primary); font-family:inherit;" />
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
          <div class="form-group">
            <label style="display:block; margin-bottom:0.4rem; color:var(--color-text-secondary); font-size:0.85rem; font-family:var(--font-heading);">Duración (minutos)</label>
            <input type="number" id="duracion" class="form-control" required min="1" placeholder="Ej. 30" style="width:100%; background:var(--glass-bg); border:1px solid var(--glass-border); padding:0.75rem; border-radius:var(--radius-md); color:var(--color-text-primary); font-family:inherit;" />
          </div>
          <div class="form-group">
            <label style="display:block; margin-bottom:0.4rem; color:var(--color-text-secondary); font-size:0.85rem; font-family:var(--font-heading);">Costo ($)</label>
            <input type="number" id="costo" class="form-control" required min="0" step="any" placeholder="Ej. 1500" style="width:100%; background:var(--glass-bg); border:1px solid var(--glass-border); padding:0.75rem; border-radius:var(--radius-md); color:var(--color-text-primary); font-family:inherit;" />
          </div>
        </div>
        <div style="display: flex; gap: 1rem; justify-content: flex-end;">
          <button type="button" class="btn-secondary" onclick="closeModal()" style="padding: 0.6rem 1.4rem;">Cancelar</button>
          <button type="submit" class="submit-btn" id="saveBtn" style="width: auto; padding: 0.6rem 1.4rem;">Guardar</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Modal Confirmar Eliminación -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-card">
      <div class="modal-title">Eliminar Servicio</div>
      <div class="modal-body">
        <p>¿Estás seguro de que querés eliminar el servicio <strong id="deleteServiceName"></strong>?</p>
        <p style="margin-top: 1rem; color: var(--color-error-text); font-size: 0.9rem;">⚠ <strong>ATENCIÓN:</strong> Esta acción no se puede deshacer.</p>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeDeleteModal()">Cancelar</button>
        <button class="btn-danger" id="confirmDeleteBtn">Sí, eliminar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/node-network.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/admin-utils.js"></script>
  <script>
    let currentData = [];
    let tiposServicio = [];
    let deleteTargetId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      renderAdminNav('servicios');
      if (!(await getAdminSessionOrRedirect())) return;
      document.getElementById('servicioForm').addEventListener('submit', saveServicio);
      document.getElementById('confirmDeleteBtn').addEventListener('click', deleteServicio);
      
      cargarTipos(); // Para el select del modal
      cargarServicios(); // Para la tabla
    });

    async function cargarTipos() {
      try {
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/tipos-servicio`);
        if (resp.ok) {
          const data = await resp.json();
          // Filtramos solo los activos para mostrarlos en el select, aunque para editar tal vez queramos todos.
          tiposServicio = data.filter(i => i.id_tipo_servicio);
          
          const select = document.getElementById('id_tipo_servicio');
          select.innerHTML = '<option value="">Seleccione un tipo...</option>';
          tiposServicio.filter(t => t.activo).forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.id_tipo_servicio;
            opt.textContent = t.nombre;
            select.appendChild(opt);
          });
        }
      } catch (err) {
        console.warn('Error al cargar tipos para el select', err);
      }
    }

    async function cargarServicios() {
      const tbody = document.getElementById('tableBody');
      const loading = document.getElementById('loadingState');
      const empty = document.getElementById('emptyState');
      
      tbody.innerHTML = '';
      loading.style.display = 'block';
      empty.style.display = 'none';

      try {
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/servicios`);
        if (!resp.ok) throw new Error('Error al cargar');
        const data = await resp.json();
        
        loading.style.display = 'none';
        
        if (!data || data.length === 0 || !data[0].id_servicio) {
          empty.style.display = 'block';
        } else {
          currentData = data.filter(i => i.id_servicio);
          renderTable(currentData);
        }
      } catch (err) {
        showToast('Error al cargar servicios', 'error');
        loading.style.display = 'none';
      }
    }

    function renderTable(items) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      
      items.forEach(item => {
        const tr = document.createElement('tr');
        
        tr.innerHTML = `
          <td><strong>${safeVal(item.nombre)}</strong></td>
          <td><span style="color:var(--color-text-secondary);">${safeVal(item.tipo_nombre)}</span></td>
          <td>⏱ ${safeVal(item.duracion, '0')} min</td>
          <td>$${safeVal(item.costo, '0')}</td>
          <td>
            <label class="toggle-switch" title="Cambiar estado activo">
              <input type="checkbox" ${item.activo ? 'checked' : ''} onchange="toggleServicioActivo('${item.id_servicio}', this.checked, this)">
              <span class="toggle-slider"></span>
            </label>
          </td>
          <td>
            <div class="actions-cell">
              <button class="btn-icon" title="Editar" onclick="editServicio('${item.id_servicio}')"><i data-lucide="pencil"></i></button>
              <button class="btn-icon danger" title="Eliminar" onclick="openDeleteModal('${item.id_servicio}')"><i data-lucide="trash-2"></i></button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
      refreshIcons(tbody);
    }

    async function toggleServicioActivo(id, nuevoEstado, checkboxEl) {
      const item = currentData.find(i => i.id_servicio === id);
      if (!item) return;

      try {
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/servicio-editar`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id_servicio: item.id_servicio,
            id_tipo_servicio: item.id_tipo_servicio,
            nombre: item.nombre,
            duracion: item.duracion,
            costo: item.costo,
            activo: nuevoEstado
          })
        });

        if (!resp.ok) throw new Error('Error al actualizar estado');
        item.activo = nuevoEstado;
        showToast(`Servicio ${nuevoEstado ? 'activado' : 'desactivado'} correctamente`, 'success');
      } catch (err) {
        showToast(err.message || 'Error al cambiar estado', 'error');
        if (checkboxEl) checkboxEl.checked = !nuevoEstado;
      }
    }

    function openModal() {
      document.getElementById('servicioId').value = '';
      document.getElementById('id_tipo_servicio').value = '';
      document.getElementById('nombre').value = '';
      document.getElementById('duracion').value = '30';
      document.getElementById('costo').value = '';
      document.getElementById('modalTitle').textContent = 'Nuevo Servicio';
      
      const modal = document.getElementById('formModal');
      modal.showModal();
      refreshIcons(modal);
    }

    function editServicio(id) {
      const item = currentData.find(i => i.id_servicio === id);
      if (!item) return;

      // Si el tipo actual está inactivo y no está en la lista de options, lo agregamos temporalmente
      const select = document.getElementById('id_tipo_servicio');
      if (!Array.from(select.options).some(opt => opt.value === item.id_tipo_servicio)) {
        const opt = document.createElement('option');
        opt.value = item.id_tipo_servicio;
        opt.textContent = item.tipo_nombre + ' (Inactivo)';
        select.appendChild(opt);
      }

      document.getElementById('servicioId').value = item.id_servicio;
      document.getElementById('id_tipo_servicio').value = item.id_tipo_servicio;
      document.getElementById('nombre').value = item.nombre;
      document.getElementById('duracion').value = item.duracion;
      document.getElementById('costo').value = item.costo;
      document.getElementById('modalTitle').textContent = 'Editar Servicio';
      
      const modal = document.getElementById('formModal');
      modal.showModal();
      refreshIcons(modal);
    }

    function closeModal() {
      document.getElementById('formModal').close();
    }

    async function saveServicio(e) {
      e.preventDefault();
      const id = document.getElementById('servicioId').value;
      const id_tipo_servicio = document.getElementById('id_tipo_servicio').value;
      const nombre = document.getElementById('nombre').value.trim();
      const duracion = parseInt(document.getElementById('duracion').value, 10);
      const costo = parseFloat(document.getElementById('costo').value);

      const existingItem = currentData.find(i => i.id_servicio === id);
      const activo = existingItem ? existingItem.activo : true;

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      try {
        let resp;
        if (id) {
          resp = await adminFetch(`${ADMIN_N8N_PREFIX}/servicio-editar`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id_servicio: id, id_tipo_servicio, nombre, duracion, costo, activo })
          });
        } else {
          resp = await adminFetch(`${ADMIN_N8N_PREFIX}/servicio-crear`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id_tipo_servicio, nombre, duracion, costo })
          });
        }

        if (!resp.ok) {
          const errData = await resp.json();
          throw new Error(errData.message || 'Error al guardar');
        }

        showToast('Guardado exitosamente', 'success');
        closeModal();
        cargarServicios();
      } catch (err) {
        showToast(err.message || 'Hubo un error', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar';
      }
    }

    function openDeleteModal(id) {
      deleteTargetId = id;
      const item = currentData.find(i => i.id_servicio === id);
      document.getElementById('deleteServiceName').textContent = item ? item.nombre : 'este servicio';
      document.getElementById('deleteModal').classList.add('visible');
    }

    function closeDeleteModal() {
      deleteTargetId = null;
      document.getElementById('deleteModal').classList.remove('visible');
    }

    async function deleteServicio() {
      if (!deleteTargetId) return;
      const id = deleteTargetId;
      const btn = document.getElementById('confirmDeleteBtn');
      btn.disabled = true;
      btn.textContent = 'Eliminando...';

      try {
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/servicio-eliminar`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id_servicio: id })
        });

        if (!resp.ok) {
          const errData = await resp.json();
          throw new Error(errData.message || 'Error al eliminar');
        }

        showToast('Servicio eliminado', 'success');
        closeDeleteModal();
        cargarServicios();
      } catch (err) {
        showToast(err.message || 'Hubo un error al eliminar', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sí, eliminar';
      }
    }
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
