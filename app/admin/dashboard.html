<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — AIONEX Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/admin-layout.css" />
  <link rel="stylesheet" href="../css/pages/admin-tables.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="bg"></div>
  
  <div class="admin-layout">
    <!-- Sidebar -->
    <header class="admin-topnav"></header>

    <!-- Main Content -->
    <main class="admin-content">
      <div class="admin-header">
        <div class="admin-title">
          <div style="display: flex; align-items: center; gap: 1rem;">
            <h1 style="margin: 0;">Dashboard</h1>
            <button class="btn-secondary" style="padding: 0.25rem 0.75rem; font-size: 0.85rem;" onclick="cargarDashboardStats()" title="Actualizar métricas">🔄 Refrescar</button>
          </div>
          <p>Resumen general del sistema <span id="lastRefreshTime" style="font-size: 0.8rem; color: var(--text-faint); margin-left: 0.5rem;"></span></p>
        </div>
        <div class="user-pill" style="position: relative; right: 0; top: 0;">
          <div class="avatar">A</div>
          <span>Administrador</span>
        </div>
      </div>

      <!-- Metrics -->
      <div class="metrics-grid">
        <div class="metric-card" onclick="window.location.href='clientes.html'" style="cursor: pointer;" title="Ir a Clientes">
          <div class="icon"><i data-lucide="users"></i></div>
          <div class="value" id="metricClientes">-</div>
          <div class="label">Clientes Totales</div>
        </div>
        <div class="metric-card" onclick="window.location.href='turnos.html'" style="cursor: pointer;" title="Ir a Turnos">
          <div class="icon"><i data-lucide="calendar"></i></div>
          <div class="value" id="metricTurnosHoy">-</div>
          <div class="label">Turnos de Hoy</div>
        </div>
        <div class="metric-card" onclick="window.location.href='turnos.html'" style="cursor: pointer;" title="Ir a Turnos">
          <div class="icon" style="color: var(--color-success-text);"><i data-lucide="calendar-check"></i></div>
          <div class="value" id="metricTurnosActivos">-</div>
          <div class="label">Turnos Activos (Futuros)</div>
        </div>
        <div class="metric-card" onclick="window.location.href='turnos.html'" style="cursor: pointer;" title="Ir a Turnos">
          <div class="icon" style="color: var(--color-error-text);"><i data-lucide="calendar-x"></i></div>
          <div class="value" id="metricCancelados">-</div>
          <div class="label">Cancelaciones (Mes)</div>
        </div>
      </div>

      <!-- Placeholder for future charts or recent activity -->
      <div class="panel" style="margin-top: 2rem;">
        <h2 style="font-size: 1.1rem; margin-bottom: 1rem;">Actividad Reciente</h2>
        <div id="loadingState">
          <div class="state-msg">
            <div class="mini-spinner"></div>
            <p>Cargando datos…</p>
          </div>
        </div>
        <div id="recentActivity" style="display:none; color: var(--color-text-secondary);">
          <!-- Esto se llenará desde n8n en la Etapa 2 -->
          <p>Los datos reales serán inyectados por el webhook de n8n.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/node-network.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/admin-utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Renderizar navegación centralizada
      renderAdminNav('dashboard');

      // 1. Validar sesión de admin
      const session = await getAdminSessionOrRedirect();
      if (!session) return;

      // 2. Cargar dashboard real desde n8n
      cargarDashboardStats();
    });

    async function cargarDashboardStats() {
      try {
        const resp = await adminFetch(`${ADMIN_N8N_PREFIX}/dashboard`);
        if (!resp.ok) throw new Error('Error de red');
        
        const data = await resp.json();
        
        document.getElementById('metricClientes').textContent = data.clientes_totales || '0';
        document.getElementById('metricTurnosHoy').textContent = data.turnos_hoy || '0';
        document.getElementById('metricTurnosActivos').textContent = data.turnos_activos || '0';
        document.getElementById('metricCancelados').textContent = data.cancelaciones_mes || '0';
        
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('recentActivity').style.display = 'block';
        
        const now = new Date();
        document.getElementById('lastRefreshTime').textContent = `(Actualizado: ${now.toLocaleTimeString()})`;
      } catch (err) {
        showToast('Error cargando métricas del dashboard', 'error');
        document.getElementById('loadingState').style.display = 'none';
      }
    }
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
