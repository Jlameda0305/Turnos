<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso — AIONEX Turnos</title>
  <meta name="description" content="Ingresá con tu DNI para ver o sacar turnos." />
  <meta property="og:title" content="Ingreso — AIONEX Turnos" />
  <meta property="og:description" content="Ingresá con tu DNI para ver o sacar turnos." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/ingreso.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="bg"></div>


  <div class="card">
    <div class="header">
      <div class="brand">
        <div class="brand-icon">A</div>
        <span class="brand-name">AIONEX</span>
      </div>
      <h1>Ingreso</h1>
      <p>Ingresá tu DNI para ver tus turnos</p>
    </div>

    <form id="ingresoForm" class="form-grid" novalidate>
      <div class="field">
        <label for="dni">DNI</label>
        <input type="text" id="dni" name="dni" placeholder="Ingresá tu DNI" inputmode="numeric" maxlength="8" required autofocus />
        <span class="field-error" id="dniError" role="alert"></span>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-text">Continuar</span>
        <div class="btn-spinner"></div>
      </button>
    </form>

    <div id="registerBlock" style="display: none; margin-top: 2rem; padding: 1.5rem; background: rgba(220, 53, 69, 0.05); border: 1px solid rgba(220, 53, 69, 0.2); border-radius: var(--radius-lg); text-align: center;">
      <div style="font-size: 2rem; margin-bottom: 0.5rem;">⚠</div>
      <h3 style="color: var(--color-text-primary); margin-bottom: 0.5rem; font-size: 1.1rem;">DNI no encontrado</h3>
      <p style="color: var(--color-text-secondary); font-size: 0.9rem; margin-bottom: 1rem;">Parece que no tenés una cuenta registrada con este DNI.</p>
      <a href="formulario.html" class="submit-btn" style="text-decoration: none; display: inline-flex; justify-content: center; background: var(--glass-bg); border: 1px solid var(--glass-border);">Registrarme ahora</a>
    </div>
  </div>

  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="js/node-network.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // ─── Validación ─────────────────────────────────
    const dniInput = document.getElementById('dni');
    const dniError = document.getElementById('dniError');

    function validateDni() {
      const val = dniInput.value.trim();
      const valid = /^\d{7,8}$/.test(val);
      if (!valid) {
        dniInput.classList.add('invalid');
        dniError.textContent = 'El DNI debe tener 7 u 8 dígitos numéricos';
      } else {
        dniInput.classList.remove('invalid');
        dniError.textContent = '';
      }
      return valid;
    }

    dniInput.addEventListener('blur', validateDni);
    dniInput.addEventListener('input', () => {
      if (dniInput.classList.contains('invalid')) validateDni();
    });

    // ─── Submit ─────────────────────────────────────
    const form = document.getElementById('ingresoForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!validateDni()) {
        dniInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.classList.add('loading');

      try {
        const resp = await fetchWithTimeout(`${N8N_BASE_URL}/webhook/ingreso`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ dni: dniInput.value.trim() })
        });

        if (resp.status === 404) {
          document.getElementById('registerBlock').style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.classList.remove('loading');
          return;
        }

        const data = await resp.json();

        if (resp.ok && data.id_cliente) {
          setCookie('session_id', data.id_cliente, 30);
          window.location.href = 'turnos.html';
        } else {
          if (data.encontrado === false) {
            document.getElementById('registerBlock').style.display = 'block';
          } else {
            showToast('Error al ingresar. Verificá los datos.', 'error');
          }
          submitBtn.disabled = false;
          submitBtn.classList.remove('loading');
        }
      } catch (err) {
        console.error('Ingreso error:', err);
        showToast('Error de conexión. Intentá nuevamente.', 'error');
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
      }
    });
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
