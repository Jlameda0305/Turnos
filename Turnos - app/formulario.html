<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro — AIONEX Turnos</title>
  <meta name="description" content="Registrate para reservar turnos online en AIONEX." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & base ──────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      color: #e2e8f0;
      padding: 1.5rem;
    }

    /* ── Background ───────────────────────────────── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -20%, rgba(99,102,241,.35), transparent),
        radial-gradient(ellipse 60% 50% at 80% 110%, rgba(14,165,233,.25), transparent),
        radial-gradient(ellipse 50% 40% at 10% 90%, rgba(168,85,247,.20), transparent),
        #0a0a1a;
      animation: bgShift 12s ease-in-out infinite alternate;
    }
    @keyframes bgShift {
      0%   { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(25deg); }
    }
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: .35; z-index: 0;
      animation: float 8s ease-in-out infinite alternate;
    }
    .orb--1 { width: 320px; height: 320px; top: -80px; right: -60px; background: #6366f1; animation-duration: 10s; }
    .orb--2 { width: 260px; height: 260px; bottom: -60px; left: -40px; background: #0ea5e9; animation-duration: 14s; animation-delay: -3s; }
    @keyframes float {
      0%   { transform: translateY(0) scale(1); }
      100% { transform: translateY(-30px) scale(1.08); }
    }

    /* ── Card ──────────────────────────────────────── */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 520px;
      padding: 2.5rem 2.25rem 2.25rem;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 24px;
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      box-shadow: 0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
      animation: cardIn .7s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      0% { opacity: 0; transform: translateY(24px) scale(.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Header ───────────────────────────────────── */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: .75rem;
    }
    .brand-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #6366f1, #0ea5e9);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 800; color: #fff;
      box-shadow: 0 4px 14px rgba(99,102,241,.3);
    }
    .brand-name {
      font-size: 1.3rem; font-weight: 700;
      background: linear-gradient(135deg, #c7d2fe, #7dd3fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header h1 {
      font-size: 1.45rem; font-weight: 700; letter-spacing: -.02em;
      margin-bottom: .3rem;
    }
    .header p {
      font-size: .88rem; color: rgba(255,255,255,.45);
    }

    /* ── Form ─────────────────────────────────────── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .9rem;
    }
    .form-grid .full { grid-column: 1 / -1; }

    .field {
      display: flex; flex-direction: column; gap: .35rem;
    }
    .field label {
      font-size: .78rem;
      font-weight: 500;
      color: rgba(255,255,255,.5);
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .field label .req {
      color: #818cf8;
      margin-left: 2px;
    }

    .field input,
    .field select {
      width: 100%;
      padding: .7rem 1rem;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: .92rem;
      transition: border-color .25s, box-shadow .25s, background .25s;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .field input::placeholder { color: rgba(255,255,255,.22); }
    .field input:focus,
    .field select:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129,140,248,.15);
      background: rgba(255,255,255,.08);
    }
    .field input.invalid,
    .field select.invalid {
      border-color: #f87171;
      box-shadow: 0 0 0 3px rgba(248,113,113,.12);
    }
    .field .field-error {
      font-size: .75rem;
      color: #fca5a5;
      min-height: 1rem;
      line-height: 1rem;
    }

    /* select arrow override */
    .select-wrap {
      position: relative;
    }
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 14px; top: 50%; transform: translateY(-50%);
      color: rgba(255,255,255,.3);
      pointer-events: none;
      font-size: .85rem;
    }
    .select-wrap select {
      padding-right: 2.2rem;
      cursor: pointer;
    }
    .select-wrap select option {
      background: #1e1e36;
      color: #e2e8f0;
    }

    /* ── Divider ──────────────────────────────────── */
    .divider {
      grid-column: 1 / -1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
      margin: .3rem 0;
    }

    /* ── Submit button ────────────────────────────── */
    .submit-btn {
      grid-column: 1 / -1;
      margin-top: .5rem;
      padding: .85rem 2rem;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, opacity .2s;
      position: relative;
      overflow: hidden;
    }
    .submit-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,.15));
      opacity: 0;
      transition: opacity .3s;
    }
    .submit-btn:hover::before { opacity: 1; }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99,102,241,.35);
    }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    .submit-btn .btn-text { position: relative; z-index: 1; }
    .submit-btn .btn-spinner {
      display: none;
      position: relative; z-index: 1;
      width: 22px; height: 22px;
      border: 2.5px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }
    .submit-btn.loading .btn-text { display: none; }
    .submit-btn.loading .btn-spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast messages ───────────────────────────── */
    .toast {
      position: fixed;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(120px);
      padding: .9rem 1.6rem;
      border-radius: 14px;
      font-size: .88rem;
      font-weight: 500;
      z-index: 100;
      transition: transform .45s cubic-bezier(.22,1,.36,1), opacity .45s;
      opacity: 0;
      backdrop-filter: blur(16px);
      max-width: 90%;
      text-align: center;
    }
    .toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast.success {
      background: rgba(34,197,94,.18);
      border: 1px solid rgba(34,197,94,.3);
      color: #86efac;
    }
    .toast.error {
      background: rgba(239,68,68,.15);
      border: 1px solid rgba(239,68,68,.25);
      color: #fca5a5;
    }

    /* ── Responsive ───────────────────────────────── */
    @media (max-width: 500px) {
      .form-grid { grid-template-columns: 1fr; }
      .card { padding: 2rem 1.5rem 1.75rem; }
      .header h1 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>

  <div class="card">
    <div class="header">
      <div class="brand">
        <div class="brand-icon">A</div>
        <span class="brand-name">AIONEX</span>
      </div>
      <h1>Crear tu cuenta</h1>
      <p>Completá tus datos para reservar turnos</p>
    </div>

    <form id="registroForm" class="form-grid" novalidate>

      <!-- DNI -->
      <div class="field">
        <label for="dni">DNI <span class="req">*</span></label>
        <input type="text" id="dni" name="dni" placeholder="12345678" inputmode="numeric" maxlength="8" required />
        <span class="field-error" id="dniError"></span>
      </div>

      <!-- Sexo -->
      <div class="field">
        <label for="sexo">Sexo <span class="req">*</span></label>
        <div class="select-wrap">
          <select id="sexo" name="sexo" required>
            <option value="" disabled selected>Seleccionar</option>
            <option value="M">Masculino</option>
            <option value="F">Femenino</option>
            <option value="X">No especifica</option>
          </select>
        </div>
        <span class="field-error" id="sexoError"></span>
      </div>

      <!-- Nombre -->
      <div class="field">
        <label for="nombre">Nombre <span class="req">*</span></label>
        <input type="text" id="nombre" name="nombre" placeholder="Juan" required />
        <span class="field-error" id="nombreError"></span>
      </div>

      <!-- Apellido -->
      <div class="field">
        <label for="apellido">Apellido <span class="req">*</span></label>
        <input type="text" id="apellido" name="apellido" placeholder="Pérez" required />
        <span class="field-error" id="apellidoError"></span>
      </div>

      <!-- Fecha de nacimiento -->
      <div class="field">
        <label for="fecha_nacimiento">Fecha de nacimiento <span class="req">*</span></label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required />
        <span class="field-error" id="fecha_nacimientoError"></span>
      </div>

      <!-- Email -->
      <div class="field">
        <label for="email">Email <span class="req">*</span></label>
        <input type="email" id="email" name="email" placeholder="juan@email.com" required />
        <span class="field-error" id="emailError"></span>
      </div>

      <div class="divider"></div>

      <!-- Dirección (opcional) -->
      <div class="field full">
        <label for="direccion">Dirección <span style="color:rgba(255,255,255,.25);font-style:italic;text-transform:none">(opcional)</span></label>
        <input type="text" id="direccion" name="direccion" placeholder="Av. Corrientes 1234, CABA" />
      </div>

      <!-- Teléfono (opcional) -->
      <div class="field">
        <label for="telefono">Teléfono <span style="color:rgba(255,255,255,.25);font-style:italic;text-transform:none">(opcional)</span></label>
        <input type="tel" id="telefono" name="telefono" placeholder="+54 11 2345-6789" />
        <span class="field-error" id="telefonoError"></span>
      </div>

      <!-- Spacer en desktop -->
      <div class="field" style="visibility:hidden" aria-hidden="true"></div>

      <!-- Submit -->
      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-text">Registrarme</span>
        <div class="btn-spinner"></div>
      </button>
    </form>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script>
    // ─── Configuración ──────────────────────────────
    const N8N_BASE_URL = '{{N8N_BASE_URL}}';

    // ─── Validaciones ───────────────────────────────
    const validators = {
      dni: {
        test: v => /^\d{7,8}$/.test(v),
        msg: 'El DNI debe tener 7 u 8 dígitos numéricos'
      },
      nombre: {
        test: v => v.trim().length >= 2,
        msg: 'Ingresá tu nombre'
      },
      apellido: {
        test: v => v.trim().length >= 2,
        msg: 'Ingresá tu apellido'
      },
      sexo: {
        test: v => ['M','F','X'].includes(v),
        msg: 'Seleccioná una opción'
      },
      fecha_nacimiento: {
        test: v => {
          if (!v) return false;
          const d = new Date(v);
          return d < new Date() && d > new Date('1900-01-01');
        },
        msg: 'Ingresá una fecha válida'
      },
      email: {
        test: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
        msg: 'Ingresá un email válido'
      },
      telefono: {
        test: v => !v || /^[0-9\s+\-()]{6,20}$/.test(v),
        msg: 'Formato de teléfono inválido'
      }
    };

    function validateField(name) {
      const el = document.getElementById(name);
      const errorEl = document.getElementById(name + 'Error');
      const validator = validators[name];
      if (!validator) return true;

      const valid = validator.test(el.value);
      if (!valid) {
        el.classList.add('invalid');
        if (errorEl) errorEl.textContent = validator.msg;
      } else {
        el.classList.remove('invalid');
        if (errorEl) errorEl.textContent = '';
      }
      return valid;
    }

    // Live validation on blur
    document.querySelectorAll('#registroForm input, #registroForm select').forEach(el => {
      el.addEventListener('blur', () => validateField(el.name || el.id));
      el.addEventListener('input', () => {
        if (el.classList.contains('invalid')) validateField(el.name || el.id);
      });
    });

    // ─── Toast ──────────────────────────────────────
    function showToast(message, type = 'error') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type}`;
      requestAnimationFrame(() => toast.classList.add('visible'));
      setTimeout(() => toast.classList.remove('visible'), 4000);
    }

    // ─── Cookie helper ──────────────────────────────
    function setCookie(name, value, days) {
      const maxAge = days * 24 * 60 * 60;
      document.cookie = `${name}=${encodeURIComponent(value)}; path=/; max-age=${maxAge}; SameSite=Lax`;
    }

    // ─── Submit ─────────────────────────────────────
    const form = document.getElementById('registroForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Validar todos los campos
      const requiredFields = ['dni', 'nombre', 'apellido', 'sexo', 'fecha_nacimiento', 'email', 'telefono'];
      let allValid = true;
      for (const field of requiredFields) {
        if (!validateField(field)) allValid = false;
      }
      if (!allValid) {
        showToast('Revisá los campos marcados en rojo', 'error');
        return;
      }

      // Preparar datos según esquema de tabla 'clientes'
      const payload = {
        dni:              document.getElementById('dni').value.trim(),
        nombre:           document.getElementById('nombre').value.trim(),
        apellido:         document.getElementById('apellido').value.trim(),
        sexo:             document.getElementById('sexo').value,
        fecha_nacimiento: document.getElementById('fecha_nacimiento').value,
        email:            document.getElementById('email').value.trim().toLowerCase(),
        direccion:        document.getElementById('direccion').value.trim() || null,
        telefono:         document.getElementById('telefono').value.trim() || null
      };

      // Bloquear botón
      submitBtn.disabled = true;
      submitBtn.classList.add('loading');

      try {
        const resp = await fetch(`${N8N_BASE_URL}/webhook/registro`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await resp.json();

        if (resp.ok && data.id_cliente) {
          // Guardar cookie de sesión
          setCookie('session_id', data.id_cliente, 30);
          showToast('¡Registro exitoso! Redirigiendo…', 'success');
          setTimeout(() => {
            window.location.href = 'turnos.html';
          }, 1200);
        } else {
          showToast(data.message || 'Error al registrar. Intentá nuevamente.', 'error');
          submitBtn.disabled = false;
          submitBtn.classList.remove('loading');
        }
      } catch (err) {
        console.error('Registro error:', err);
        showToast('Error de conexión. Verificá tu red e intentá de nuevo.', 'error');
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
      }
    });

    // ─── Set max date for fecha_nacimiento ──────────
    (function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('fecha_nacimiento').setAttribute('max', today);
    })();
  </script>
</body>
</html>
