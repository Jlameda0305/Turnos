<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservar Turno — AIONEX</title>
  <meta name="description" content="Seleccioná fecha y horario para reservar tu turno en AIONEX." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & base ──────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: #0a0a1a;
      color: #e2e8f0;
      padding: 2rem 1.25rem;
    }

    /* ── Background ───────────────────────────────── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -20%, rgba(99,102,241,.35), transparent),
        radial-gradient(ellipse 60% 50% at 80% 110%, rgba(14,165,233,.25), transparent),
        radial-gradient(ellipse 50% 40% at 10% 90%, rgba(168,85,247,.20), transparent),
        #0a0a1a;
      animation: bgShift 12s ease-in-out infinite alternate;
    }
    @keyframes bgShift { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(25deg); } }
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: .35; z-index: 0;
      animation: float 8s ease-in-out infinite alternate;
    }
    .orb--1 { width: 320px; height: 320px; top: -80px; left: -60px; background: #6366f1; animation-duration: 10s; }
    .orb--2 { width: 260px; height: 260px; bottom: -60px; right: -40px; background: #0ea5e9; animation-duration: 14s; animation-delay: -3s; }
    .orb--3 { width: 200px; height: 200px; top: 50%; left: 55%; background: #a855f7; animation-duration: 12s; animation-delay: -5s; }
    @keyframes float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-30px) scale(1.08); } }

    /* ── Main container ──────────────────────────── */
    .main {
      position: relative; z-index: 1;
      width: 100%; max-width: 680px;
      animation: cardIn .7s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn { 0% { opacity: 0; transform: translateY(24px); } 100% { opacity: 1; transform: translateY(0); } }

    /* ── Header ──────────────────────────────────── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }
    .brand {
      display: inline-flex; align-items: center; gap: .5rem;
    }
    .brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6366f1, #0ea5e9);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 800; color: #fff;
      box-shadow: 0 4px 14px rgba(99,102,241,.3);
    }
    .brand-name {
      font-size: 1.2rem; font-weight: 700;
      background: linear-gradient(135deg, #c7d2fe, #7dd3fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .user-pill {
      display: flex; align-items: center; gap: .5rem;
      padding: .45rem .9rem;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 999px;
      font-size: .78rem;
      color: rgba(255,255,255,.55);
    }
    .user-pill .avatar {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #818cf8, #6366f1);
      display: flex; align-items: center; justify-content: center;
      font-size: .65rem; font-weight: 700; color: #fff;
    }
    .logout-btn {
      background: none; border: none; color: rgba(255,255,255,.35);
      cursor: pointer; font-size: .75rem; margin-left: .3rem;
      transition: color .2s;
    }
    .logout-btn:hover { color: #f87171; }

    /* ── Section title ────────────────────────────── */
    .section-title {
      font-size: 1.5rem; font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: .35rem;
    }
    .section-subtitle {
      font-size: .88rem;
      color: rgba(255,255,255,.4);
      margin-bottom: 1.75rem;
    }

    /* ── Glass panel ──────────────────────────────── */
    .panel {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 20px;
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      box-shadow: 0 6px 28px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.04);
      padding: 1.75rem;
      margin-bottom: 1.25rem;
    }

    /* ── Date picker ──────────────────────────────── */
    .date-section {
      display: flex; align-items: center; gap: 1rem;
      flex-wrap: wrap;
    }
    .date-section label {
      font-size: .82rem; font-weight: 500;
      color: rgba(255,255,255,.5);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .date-input {
      flex: 1; min-width: 180px;
      padding: .7rem 1rem;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: .92rem;
      outline: none;
      transition: border-color .25s, box-shadow .25s;
      -webkit-appearance: none;
    }
    .date-input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129,140,248,.15);
    }
    .day-badge {
      padding: .35rem .85rem;
      background: rgba(129,140,248,.12);
      border: 1px solid rgba(129,140,248,.2);
      border-radius: 999px;
      font-size: .78rem; font-weight: 600;
      color: #a5b4fc;
      text-transform: capitalize;
    }

    /* ── Slots grid ───────────────────────────────── */
    .slots-title {
      font-size: .82rem; font-weight: 500;
      color: rgba(255,255,255,.5);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: .9rem;
    }
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: .6rem;
    }
    .slot {
      padding: .65rem .5rem;
      border-radius: 12px;
      font-size: .88rem;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      transition: all .25s;
      border: 1px solid transparent;
      user-select: none;
    }

    /* disponible */
    .slot.available {
      background: rgba(255,255,255,.05);
      border-color: rgba(255,255,255,.08);
      color: rgba(255,255,255,.7);
    }
    .slot.available:hover {
      background: rgba(129,140,248,.12);
      border-color: rgba(129,140,248,.3);
      color: #c7d2fe;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99,102,241,.15);
    }
    .slot.selected {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      border-color: transparent;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99,102,241,.3);
    }

    /* ocupado */
    .slot.taken {
      background: rgba(239,68,68,.07);
      border-color: rgba(239,68,68,.12);
      color: rgba(255,255,255,.2);
      cursor: not-allowed;
      text-decoration: line-through;
    }

    /* ── Legend ────────────────────────────────────── */
    .legend {
      display: flex; gap: 1.25rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex; align-items: center; gap: .4rem;
      font-size: .75rem; color: rgba(255,255,255,.4);
    }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 4px;
    }
    .legend-dot.available-dot { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.15); }
    .legend-dot.taken-dot { background: rgba(239,68,68,.2); border: 1px solid rgba(239,68,68,.2); }
    .legend-dot.selected-dot { background: linear-gradient(135deg, #6366f1, #818cf8); }

    /* ── Observaciones ────────────────────────────── */
    .obs-section { margin-top: 1.25rem; }
    .obs-section label {
      display: block;
      font-size: .82rem; font-weight: 500;
      color: rgba(255,255,255,.5);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: .4rem;
    }
    .obs-input {
      width: 100%;
      padding: .7rem 1rem;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: .88rem;
      outline: none;
      resize: vertical;
      min-height: 70px;
      transition: border-color .25s, box-shadow .25s;
    }
    .obs-input::placeholder { color: rgba(255,255,255,.2); }
    .obs-input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(129,140,248,.15);
    }

    /* ── Confirm button ───────────────────────────── */
    .confirm-btn {
      width: 100%;
      margin-top: 1.25rem;
      padding: .9rem 2rem;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s, opacity .2s;
      position: relative;
      overflow: hidden;
    }
    .confirm-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,.15));
      opacity: 0; transition: opacity .3s;
    }
    .confirm-btn:hover::before { opacity: 1; }
    .confirm-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99,102,241,.35);
    }
    .confirm-btn:active { transform: translateY(0); }
    .confirm-btn:disabled {
      opacity: .4; cursor: not-allowed;
      transform: none !important; box-shadow: none !important;
    }
    .confirm-btn .btn-text { position: relative; z-index: 1; }
    .confirm-btn .btn-spinner {
      display: none; position: relative; z-index: 1;
      width: 22px; height: 22px;
      border: 2.5px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto;
    }
    .confirm-btn.loading .btn-text { display: none; }
    .confirm-btn.loading .btn-spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty / loading states ───────────────────── */
    .state-msg {
      text-align: center;
      padding: 2.5rem 1rem;
      color: rgba(255,255,255,.3);
      font-size: .92rem;
    }
    .state-msg .icon {
      font-size: 2.2rem;
      margin-bottom: .75rem;
    }
    .mini-spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,.08);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto .75rem;
    }

    /* ── Toast ─────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 2rem; left: 50%;
      transform: translateX(-50%) translateY(120px);
      padding: .9rem 1.6rem;
      border-radius: 14px;
      font-size: .88rem; font-weight: 500;
      z-index: 100;
      transition: transform .45s cubic-bezier(.22,1,.36,1), opacity .45s;
      opacity: 0;
      backdrop-filter: blur(16px);
      max-width: 90%; text-align: center;
    }
    .toast.visible {
      transform: translateX(-50%) translateY(0); opacity: 1;
    }
    .toast.success {
      background: rgba(34,197,94,.18);
      border: 1px solid rgba(34,197,94,.3);
      color: #86efac;
    }
    .toast.error {
      background: rgba(239,68,68,.15);
      border: 1px solid rgba(239,68,68,.25);
      color: #fca5a5;
    }

    /* ── Success overlay ──────────────────────────── */
    .success-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 50;
      background: rgba(10,10,26,.85);
      backdrop-filter: blur(12px);
      align-items: center; justify-content: center;
      animation: fadeIn .4s ease;
    }
    .success-overlay.visible { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .success-card {
      text-align: center;
      padding: 3rem 2.5rem;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      backdrop-filter: blur(24px);
      max-width: 420px; width: 90%;
      animation: cardIn .6s cubic-bezier(.22,1,.36,1) both;
    }
    .success-icon {
      width: 72px; height: 72px;
      margin: 0 auto 1.25rem;
      background: linear-gradient(135deg, rgba(34,197,94,.15), rgba(34,197,94,.05));
      border: 2px solid rgba(34,197,94,.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
    }
    .success-card h2 {
      font-size: 1.35rem; font-weight: 700; margin-bottom: .4rem;
    }
    .success-card p {
      font-size: .9rem; color: rgba(255,255,255,.5);
      margin-bottom: 1.5rem; line-height: 1.5;
    }
    .success-detail {
      display: flex; justify-content: center; gap: 2rem;
      margin-bottom: 1.5rem;
    }
    .success-detail .detail-item {
      text-align: center;
    }
    .success-detail .detail-label {
      font-size: .72rem; color: rgba(255,255,255,.35);
      text-transform: uppercase; letter-spacing: .06em;
      margin-bottom: .2rem;
    }
    .success-detail .detail-value {
      font-size: 1.1rem; font-weight: 600; color: #a5b4fc;
    }
    .new-turno-btn {
      padding: .75rem 2rem;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px;
      color: #e2e8f0;
      font-family: inherit;
      font-size: .88rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .new-turno-btn:hover {
      background: rgba(255,255,255,.1);
      border-color: rgba(255,255,255,.15);
    }

    /* ── Responsive ───────────────────────────────── */
    @media (max-width: 500px) {
      body { padding: 1.25rem .75rem; }
      .panel { padding: 1.25rem; }
      .section-title { font-size: 1.25rem; }
      .slots-grid { grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); }
      .top-bar { flex-wrap: wrap; gap: .75rem; }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>

  <div class="main">
    <!-- Top bar -->
    <div class="top-bar">
      <div class="brand">
        <div class="brand-icon">A</div>
        <span class="brand-name">AIONEX</span>
      </div>
      <div class="user-pill" id="userPill">
        <div class="avatar" id="userAvatar">?</div>
        <span id="userName">Cargando…</span>
        <button class="logout-btn" id="logoutBtn" title="Cerrar sesión">✕</button>
      </div>
    </div>

    <!-- Title -->
    <h1 class="section-title">Reservar turno</h1>
    <p class="section-subtitle">Seleccioná una fecha y un horario disponible</p>

    <!-- Date panel -->
    <div class="panel">
      <div class="date-section">
        <label for="fechaInput">Fecha</label>
        <input type="date" class="date-input" id="fechaInput" />
        <span class="day-badge" id="dayBadge" style="display:none;"></span>
      </div>
    </div>

    <!-- Slots panel -->
    <div class="panel" id="slotsPanel">
      <div class="state-msg" id="emptyState">
        <div class="icon">📅</div>
        <p>Seleccioná una fecha para ver los horarios disponibles</p>
      </div>

      <div id="loadingState" style="display:none;">
        <div class="state-msg">
          <div class="mini-spinner"></div>
          <p>Cargando horarios…</p>
        </div>
      </div>

      <div id="slotsContent" style="display:none;">
        <p class="slots-title">Horarios disponibles</p>
        <div class="slots-grid" id="slotsGrid"></div>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot available-dot"></div> Disponible</div>
          <div class="legend-item"><div class="legend-dot taken-dot"></div> Ocupado</div>
          <div class="legend-item"><div class="legend-dot selected-dot"></div> Seleccionado</div>
        </div>

        <div class="obs-section">
          <label for="obsInput">Observaciones <span style="color:rgba(255,255,255,.25);font-style:italic;text-transform:none">(opcional)</span></label>
          <textarea class="obs-input" id="obsInput" placeholder="Alguna indicación especial para tu turno…"></textarea>
        </div>

        <button class="confirm-btn" id="confirmBtn" disabled>
          <span class="btn-text">Confirmar reserva</span>
          <div class="btn-spinner"></div>
        </button>
      </div>
    </div>
  </div>

  <!-- Success overlay -->
  <div class="success-overlay" id="successOverlay">
    <div class="success-card">
      <div class="success-icon">✓</div>
      <h2>¡Turno reservado!</h2>
      <p>Tu reserva fue registrada correctamente.</p>
      <div class="success-detail">
        <div class="detail-item">
          <div class="detail-label">Fecha</div>
          <div class="detail-value" id="successFecha">—</div>
        </div>
        <div class="detail-item">
          <div class="detail-label">Hora</div>
          <div class="detail-value" id="successHora">—</div>
        </div>
      </div>
      <button class="new-turno-btn" id="newTurnoBtn">Reservar otro turno</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ─── Configuración ──────────────────────────────
    const N8N_BASE_URL = '{{N8N_BASE_URL}}';

    // Horarios del negocio (08:00 a 18:00 cada 30 min)
    const HORA_INICIO = 8;
    const HORA_FIN    = 18;
    const INTERVALO   = 30; // minutos

    // ─── Estado ─────────────────────────────────────
    let sessionId    = null;
    let selectedSlot = null;

    // ─── Helpers ────────────────────────────────────
    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? decodeURIComponent(match[2]) : null;
    }

    function showToast(message, type = 'error') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type}`;
      requestAnimationFrame(() => toast.classList.add('visible'));
      setTimeout(() => toast.classList.remove('visible'), 4000);
    }

    function generarHorarios() {
      const slots = [];
      for (let h = HORA_INICIO; h < HORA_FIN; h++) {
        for (let m = 0; m < 60; m += INTERVALO) {
          slots.push(
            String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0')
          );
        }
      }
      return slots;
    }

    const DIAS_SEMANA = {
      0: 'domingo', 1: 'lunes', 2: 'martes', 3: 'miércoles',
      4: 'jueves', 5: 'viernes', 6: 'sábado'
    };

    function formatFechaDisplay(dateStr) {
      const [y, m, d] = dateStr.split('-');
      return `${d}/${m}/${y}`;
    }

    // ─── Verificar sesión ───────────────────────────
    function init() {
      sessionId = getCookie('session_id');
      if (!sessionId) {
        window.location.href = 'router.html';
        return;
      }

      // Set min date = hoy
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm   = String(today.getMonth() + 1).padStart(2, '0');
      const dd   = String(today.getDate()).padStart(2, '0');
      const todayStr = `${yyyy}-${mm}-${dd}`;
      document.getElementById('fechaInput').setAttribute('min', todayStr);

      // Cargar info del usuario
      cargarUsuario();

      // Eventos
      document.getElementById('fechaInput').addEventListener('change', onFechaChange);
      document.getElementById('confirmBtn').addEventListener('click', confirmarReserva);
      document.getElementById('logoutBtn').addEventListener('click', cerrarSesion);
      document.getElementById('newTurnoBtn').addEventListener('click', nuevoTurno);
    }

    async function cargarUsuario() {
      try {
        const resp = await fetch(`${N8N_BASE_URL}/webhook/usuario`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId })
        });
        if (resp.ok) {
          const data = await resp.json();
          if (data.nombre) {
            const nombre  = data.nombre;
            const inicial = nombre.charAt(0).toUpperCase();
            document.getElementById('userName').textContent = `${nombre} ${data.apellido || ''}`;
            document.getElementById('userAvatar').textContent = inicial;
          }
        }
      } catch (e) {
        console.warn('No se pudo cargar info del usuario:', e);
      }
    }

    // ─── Cambio de fecha ────────────────────────────
    async function onFechaChange(e) {
      const fecha = e.target.value;
      if (!fecha) return;

      // Mostrar día de la semana
      const dateObj = new Date(fecha + 'T12:00:00');
      const diaSemana = DIAS_SEMANA[dateObj.getDay()];
      const badge = document.getElementById('dayBadge');
      badge.textContent = diaSemana;
      badge.style.display = 'inline-block';

      // Reset
      selectedSlot = null;
      document.getElementById('confirmBtn').disabled = true;

      // Show loading
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('slotsContent').style.display = 'none';
      document.getElementById('loadingState').style.display = 'block';

      try {
        const resp = await fetch(`${N8N_BASE_URL}/webhook/turnos-disponibles`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fecha, session_id: sessionId })
        });

        if (!resp.ok) throw new Error('Error del servidor');

        const data = await resp.json();
        const ocupados = (data.ocupados || []).map(t => t.hora ? t.hora.substring(0,5) : t);

        renderSlots(ocupados);
      } catch (err) {
        console.error('Error al cargar turnos:', err);
        showToast('No se pudieron cargar los horarios. Intentá de nuevo.', 'error');
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
      }
    }

    // ─── Renderizar slots ───────────────────────────
    function renderSlots(ocupados) {
      const grid     = document.getElementById('slotsGrid');
      const allSlots = generarHorarios();

      grid.innerHTML = '';

      allSlots.forEach(hora => {
        const div = document.createElement('div');
        div.classList.add('slot');
        div.textContent = hora;

        if (ocupados.includes(hora)) {
          div.classList.add('taken');
          div.title = 'Horario no disponible';
        } else {
          div.classList.add('available');
          div.addEventListener('click', () => selectSlot(div, hora));
        }

        grid.appendChild(div);
      });

      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('slotsContent').style.display = 'block';
    }

    function selectSlot(el, hora) {
      // Deseleccionar anterior
      document.querySelectorAll('.slot.selected').forEach(s => {
        s.classList.remove('selected');
        s.classList.add('available');
      });

      el.classList.remove('available');
      el.classList.add('selected');
      selectedSlot = hora;
      document.getElementById('confirmBtn').disabled = false;
    }

    // ─── Confirmar reserva ──────────────────────────
    async function confirmarReserva() {
      const fecha = document.getElementById('fechaInput').value;
      const obs   = document.getElementById('obsInput').value.trim();

      if (!fecha || !selectedSlot) {
        showToast('Seleccioná una fecha y un horario', 'error');
        return;
      }

      const btn = document.getElementById('confirmBtn');
      btn.disabled = true;
      btn.classList.add('loading');

      try {
        const resp = await fetch(`${N8N_BASE_URL}/webhook/reservar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id:    sessionId,
            fecha:         fecha,
            hora:          selectedSlot,
            observaciones: obs || null
          })
        });

        const data = await resp.json();

        if (resp.ok && data.success) {
          // Mostrar overlay de éxito
          document.getElementById('successFecha').textContent = formatFechaDisplay(fecha);
          document.getElementById('successHora').textContent = selectedSlot;
          document.getElementById('successOverlay').classList.add('visible');
        } else if (resp.status === 409) {
          showToast(data.message || 'Ese horario ya fue reservado. Elegí otro.', 'error');
          // Recargar slots
          onFechaChange({ target: { value: fecha } });
        } else {
          showToast(data.message || 'Error al reservar. Intentá de nuevo.', 'error');
        }
      } catch (err) {
        console.error('Error al reservar:', err);
        showToast('Error de conexión. Verificá tu red.', 'error');
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    }

    // ─── Nuevo turno ────────────────────────────────
    function nuevoTurno() {
      document.getElementById('successOverlay').classList.remove('visible');
      selectedSlot = null;
      document.getElementById('confirmBtn').disabled = true;
      document.getElementById('obsInput').value = '';
      // Recargar slots de la misma fecha
      const fecha = document.getElementById('fechaInput').value;
      if (fecha) {
        onFechaChange({ target: { value: fecha } });
      }
    }

    // ─── Cerrar sesión ──────────────────────────────
    function cerrarSesion() {
      document.cookie = 'session_id=; path=/; max-age=0';
      window.location.href = 'router.html';
    }

    // ─── Init ───────────────────────────────────────
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
