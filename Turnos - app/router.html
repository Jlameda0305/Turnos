<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIONEX — Turnos</title>
  <meta name="description" content="Sistema de reserva de turnos online. Accedé rápidamente a tu agenda." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & base ──────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { font-size: 16px; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      overflow: hidden;
      color: #e2e8f0;
    }

    /* ── Animated gradient background ─────────────── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -20%, rgba(99,102,241,.35), transparent),
        radial-gradient(ellipse 60% 50% at 80% 110%, rgba(14,165,233,.25), transparent),
        radial-gradient(ellipse 50% 40% at 10% 90%, rgba(168,85,247,.20), transparent),
        #0a0a1a;
      animation: bgShift 12s ease-in-out infinite alternate;
    }
    @keyframes bgShift {
      0%   { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(25deg); }
    }

    /* ── Floating orbs ────────────────────────────── */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: .4; z-index: 0;
      animation: float 8s ease-in-out infinite alternate;
    }
    .orb--1 { width: 320px; height: 320px; top: -80px; left: -60px; background: #6366f1; animation-duration: 10s; }
    .orb--2 { width: 260px; height: 260px; bottom: -60px; right: -40px; background: #0ea5e9; animation-duration: 14s; animation-delay: -3s; }
    .orb--3 { width: 200px; height: 200px; top: 40%; left: 60%; background: #a855f7; animation-duration: 11s; animation-delay: -6s; }
    @keyframes float {
      0%   { transform: translateY(0) scale(1); }
      100% { transform: translateY(-30px) scale(1.08); }
    }

    /* ── Card ──────────────────────────────────────── */
    .card {
      position: relative; z-index: 1;
      width: 90%; max-width: 420px;
      padding: 3rem 2.5rem;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      text-align: center;
      box-shadow:
        0 8px 32px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.06);
      animation: cardIn .8s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      0% { opacity: 0; transform: translateY(30px) scale(.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Logo / Brand ─────────────────────────────── */
    .brand {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: 2rem;
    }
    .brand-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #6366f1, #0ea5e9);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; font-weight: 800; color: #fff;
      box-shadow: 0 4px 16px rgba(99,102,241,.35);
    }
    .brand-name {
      font-size: 1.5rem; font-weight: 700;
      background: linear-gradient(135deg, #c7d2fe, #7dd3fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -.02em;
    }

    /* ── Spinner ───────────────────────────────────── */
    .spinner-wrap {
      display: flex; flex-direction: column;
      align-items: center; gap: 1.5rem;
      margin-top: .5rem;
    }
    .spinner {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.08);
      border-top-color: #818cf8;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status {
      font-size: .95rem; color: rgba(255,255,255,.55);
      font-weight: 400;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: .5; }
    }

    /* ── Error state ──────────────────────────────── */
    .error-msg {
      display: none;
      margin-top: 1.5rem;
      padding: 1rem 1.25rem;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 12px;
      color: #fca5a5;
      font-size: .88rem;
      line-height: 1.5;
    }
    .error-msg.visible { display: block; animation: cardIn .4s ease both; }

    .retry-btn {
      margin-top: 1.25rem;
      display: none;
      padding: .7rem 2rem;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99,102,241,.35);
    }
    .retry-btn.visible { display: inline-flex; }
  </style>
</head>
<body>

  <!-- Background layers -->
  <div class="bg"></div>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>

  <!-- Main card -->
  <div class="card" id="mainCard">
    <div class="brand">
      <div class="brand-icon">A</div>
      <span class="brand-name">AIONEX</span>
    </div>

    <div class="spinner-wrap" id="spinnerWrap">
      <div class="spinner"></div>
      <p class="status" id="statusText">Verificando sesión…</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>
    <button class="retry-btn" id="retryBtn" onclick="verificarSesion()">Reintentar</button>
  </div>

  <script>
    // ─── Configuración ──────────────────────────────
    // Reemplazá esta URL con la de tu instancia de n8n
    const N8N_BASE_URL = '{{N8N_BASE_URL}}';

    // ─── Helpers ────────────────────────────────────
    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? decodeURIComponent(match[2]) : null;
    }

    function showError(msg) {
      const spinner = document.getElementById('spinnerWrap');
      const errorEl = document.getElementById('errorMsg');
      const retryEl = document.getElementById('retryBtn');
      spinner.style.display = 'none';
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
      retryEl.classList.add('visible');
    }

    function showLoading() {
      const spinner = document.getElementById('spinnerWrap');
      const errorEl = document.getElementById('errorMsg');
      const retryEl = document.getElementById('retryBtn');
      spinner.style.display = 'flex';
      errorEl.classList.remove('visible');
      retryEl.classList.remove('visible');
    }

    // ─── Verificación de sesión ─────────────────────
    async function verificarSesion() {
      showLoading();

      const sessionId = getCookie('session_id');

      // Si no hay cookie → formulario directamente
      if (!sessionId) {
        document.getElementById('statusText').textContent = 'Redirigiendo al registro…';
        await delay(600);
        window.location.href = 'formulario.html';
        return;
      }

      // Si hay cookie → validar con n8n
      try {
        document.getElementById('statusText').textContent = 'Validando tu sesión…';
        const resp = await fetch(`${N8N_BASE_URL}/webhook/router`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId })
        });

        if (!resp.ok) throw new Error(`Error del servidor (${resp.status})`);

        const data = await resp.json();

        if (data.valid) {
          document.getElementById('statusText').textContent = '¡Sesión válida! Redirigiendo…';
          await delay(500);
          window.location.href = 'turnos.html';
        } else {
          // Cookie inválida — limpiar y redirigir al formulario
          document.cookie = 'session_id=; path=/; max-age=0';
          document.getElementById('statusText').textContent = 'Sesión expirada. Redirigiendo…';
          await delay(500);
          window.location.href = 'formulario.html';
        }
      } catch (err) {
        showError('No se pudo conectar con el servidor. Verificá tu conexión e intentá nuevamente.');
        console.error('Router error:', err);
      }
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // ─── Iniciar ────────────────────────────────────
    document.addEventListener('DOMContentLoaded', verificarSesion);
  </script>
</body>
</html>
